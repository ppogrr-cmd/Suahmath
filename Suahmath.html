<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F7F7F2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Candy's Math">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" href="/apple-touch-icon.png">
<title>Candy's Math</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  :root{
    --paper:#F7F7F2; --grid:#E2E5DC; --ink:#23282B; --ink-soft:#6B7278;
    --line:#D8DBD2; --wrong:#DE3B2F; --again:#E8931C; --known:#2E9E5B; --act:#2F5FD0;
    --case:#213551; --pink:#FF8CB7; --card:#FFFFFF; --radius:14px; --safe-b:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
    color:var(--ink);background-color:var(--paper);
    background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
    background-size:22px 22px;font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
  .wrap{max-width:560px;margin:0 auto;padding:16px 16px calc(40px + var(--safe-b))}
  button{font-family:inherit;font-size:inherit;cursor:pointer;border:none;background:none;color:inherit}
  .hidden{display:none !important}

  .head{display:flex;align-items:center;gap:10px;margin:2px 0 14px}
  .head .mark{width:40px;height:40px;border-radius:11px;background:linear-gradient(#213551,#1B2A41);
    color:var(--pink);font-weight:700;font-size:17px;display:flex;align-items:center;justify-content:center;flex:none}
  .head h1{font-size:19px;font-weight:700;margin:0;letter-spacing:-0.02em}
  .head p{margin:1px 0 0;font-size:12px;color:var(--ink-soft)}

  .signal{display:flex;gap:9px;background:var(--case);border-radius:22px;padding:11px;margin-bottom:14px}
  .lamp{flex:1;border-radius:17px;padding:15px 6px 12px;text-align:center;color:#fff;
    background:rgba(255,255,255,.07);transition:background .18s,box-shadow .18s}
  .lamp b{display:block;font-size:27px;font-weight:700;line-height:1.05;letter-spacing:-0.03em}
  .lamp span{display:block;font-size:11px;margin-top:3px;opacity:.85}
  .lamp.lit-red{background:var(--wrong)} .lamp.lit-again{background:var(--again)} .lamp.lit-green{background:var(--known)}
  .lamp.off{color:rgba(255,255,255,.4)}
  .lamp[aria-pressed="true"]{box-shadow:0 0 0 3px #fff,0 0 0 5px var(--case)}
  .w{color:var(--wrong)} .ag{color:var(--again)} .kn{color:var(--known)}

  .big{display:flex;align-items:center;justify-content:space-between;width:100%;background:var(--ink);color:#fff;
    border-radius:var(--radius);padding:18px;font-size:17px;font-weight:600;margin-bottom:10px}
  .big.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}
  .big .cnt{font-size:14px;font-weight:500;opacity:.75}
  .big:disabled{opacity:.4}

  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chips button{padding:8px 12px;border:1px solid var(--line);border-radius:999px;background:var(--card);font-size:14px}
  .chips button[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}

  .listhead{display:flex;align-items:baseline;justify-content:space-between;margin:18px 0 10px}
  .listhead .lt{font-weight:700;font-size:15px}
  .listhead button{font-size:14px;color:var(--act);font-weight:600}

  .item{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--card);
    border:1px solid var(--line);border-radius:var(--radius);padding:13px 14px;margin-bottom:8px}
  .item .dot{flex:none;width:20px;height:20px;border-radius:50%}
  .item.l-red .dot{background:var(--wrong)} .item.l-again .dot{background:var(--again)} .item.l-green .dot{background:var(--known)}
  .item .meta{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:3px}
  .item .top{display:flex;align-items:center;gap:6px}
  .unit{font-size:13px;font-weight:600}
  .item .note{font-size:13px;color:var(--ink-soft);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .item .date{font-size:11px;color:var(--ink-soft)}
  .badge{font-size:11px;padding:2px 7px;border-radius:999px;border:1px solid currentColor;flex:none}
  .empty{padding:40px 12px;text-align:center;color:var(--ink-soft);font-size:14px;line-height:1.7}
  .more{width:100%;padding:14px;border:1px solid var(--line);border-radius:var(--radius);background:var(--card);color:var(--ink-soft);font-size:14px}

  .screen{position:fixed;inset:0;background:var(--paper);z-index:20;overflow-y:auto;padding:14px 16px calc(20px + var(--safe-b))}
  .bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
  .bar .t{font-weight:700}
  .bar .pos{font-size:13px;color:var(--ink-soft);min-width:52px;text-align:right}
  .bar button{font-size:15px;color:var(--act);font-weight:600;padding:6px 2px}
  label.f2{display:block;font-size:13px;color:var(--ink-soft);margin:16px 0 6px}
  input[type=text]{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--card);
    font-family:inherit;font-size:16px;color:var(--ink)}

  .progress{height:4px;background:var(--line);border-radius:2px;overflow:hidden;margin-bottom:12px}
  .progress i{display:block;height:100%;background:var(--ink);transition:width .25s}
  .qwrap{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px 15px;margin-bottom:14px}
  .qmeta{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-soft);margin-bottom:10px}
  .nav{display:flex;gap:8px;margin:12px 0 10px}
  .nav button{flex:1;padding:13px 6px;border:1px solid var(--line);border-radius:12px;background:var(--card);
    font-weight:600;font-size:14px;color:var(--ink-soft)}
  .nav button:disabled{opacity:.35}
  .judge{display:flex;gap:10px;position:sticky;bottom:calc(10px + var(--safe-b))}
  .judge button{flex:1;padding:18px 10px;border-radius:var(--radius);font-size:17px;font-weight:700;color:#fff}
  .judge .again{background:var(--again)} .judge .got{background:var(--known)}
  .done{text-align:center;padding:60px 10px}
  .done .big-n{font-size:44px;font-weight:700;letter-spacing:-0.03em}

  .q{font-size:17px;line-height:1.75}
  .f{display:inline-flex;flex-direction:column;vertical-align:-0.5em;text-align:center;line-height:1.1;margin:0 3px;font-size:.85em}
  .f i{font-style:normal;display:block;padding:0 3px}
  .f i:first-child{border-bottom:1.5px solid currentColor}
  pre.v{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:16px;line-height:1.5;margin:10px 0;white-space:pre}
  .bx{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:10px 0;font-size:15px;background:var(--paper)}
  .fg{margin:10px 0;padding:9px 12px;border-left:3px solid var(--act);background:var(--paper);font-size:14px;color:var(--ink-soft);line-height:1.6}

  .reveal{display:flex;gap:8px;margin-top:14px}
  .reveal button{flex:1;padding:14px 8px;border:1px solid var(--line);border-radius:12px;background:var(--card);font-weight:600;font-size:15px}
  .reveal button[aria-expanded="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
  .box-h,.box-a{margin-top:10px;padding:13px 15px;border-radius:12px;font-size:15px;line-height:1.7}
  .box-h{background:#FDF4E2;border:1px solid #EEDCB4}
  .box-a{background:#E9F5EE;border:1px solid #BFE0CC;font-weight:600}
  .box-h b,.box-a b{display:block;font-size:12px;font-weight:600;opacity:.6;margin-bottom:4px}

  .row{display:flex;gap:8px;margin-top:14px}
  .row button{flex:1;padding:13px 6px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-weight:600;font-size:14px}
  .row button.on-w{background:var(--wrong);color:#fff;border-color:var(--wrong)}
  .row button.on-ag{background:var(--again);color:#fff;border-color:var(--again)}
  .row button.on-k{background:var(--known);color:#fff;border-color:var(--known)}
  .hist{font-size:12px;color:var(--ink-soft);margin-top:14px;line-height:1.8}
  .note{font-size:13px;color:var(--ink-soft);line-height:1.7;margin-top:10px}
  .danger{color:var(--wrong);font-weight:600;padding:12px 0;width:100%;text-align:center;margin-top:18px}


  /* 인쇄 고르기 */
  .pick{display:flex;gap:11px;align-items:center;width:100%;text-align:left;background:var(--card);
    border:1px solid var(--line);border-radius:var(--radius);padding:12px 13px;margin-bottom:7px}
  .pick .chk{flex:none;width:22px;height:22px;border-radius:7px;border:1.5px solid var(--line);
    display:flex;align-items:center;justify-content:center;font-size:13px;color:#fff}
  .pick[aria-pressed="true"] .chk{background:var(--act);border-color:var(--act)}
  .pick .meta{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
  .pick .unit{font-size:13px;font-weight:600}
  .pick .note{font-size:13px;color:var(--ink-soft);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pick .dot{flex:none;width:12px;height:12px;border-radius:50%}
  .pick.l-red .dot{background:var(--wrong)} .pick.l-again .dot{background:var(--again)} .pick.l-green .dot{background:var(--known)}
  .stick{position:sticky;bottom:calc(10px + var(--safe-b));padding-top:10px}
  .stick button{width:100%;padding:17px;border-radius:var(--radius);background:var(--act);color:#fff;font-weight:700;font-size:17px}
  .stick button:disabled{opacity:.4}

  /* 인쇄물 */
  #printArea{display:none}
  @media print{
    body{background:none !important}
    .wrap,.screen,.toast{display:none !important}
    #printArea{display:block !important}
    @page{size:A4;margin:15mm 14mm}
  }
  #printArea .p-head{border-bottom:2px solid #000;padding-bottom:6px;margin-bottom:10px;
    display:flex;justify-content:space-between;align-items:baseline;font-size:12pt}
  #printArea .p-head b{font-size:13pt}
  #printArea .p-item{break-inside:avoid;page-break-inside:avoid;padding:9px 0;border-bottom:1px dashed #B9BDB4}
  #printArea .p-no{font-weight:700;margin-right:6px}
  #printArea .p-tag{font-size:9pt;color:#555}
  #printArea .q{font-size:11.5pt;line-height:1.6}
  #printArea .fg{border-left:2px solid #999;background:none;color:#333}
  #printArea .p-ans{page-break-before:always;break-before:page}
  #printArea .p-ans li{font-size:10.5pt;margin-bottom:5px;line-height:1.5}
  .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + var(--safe-b));background:var(--ink);color:#fff;
    padding:11px 18px;border-radius:999px;font-size:14px;z-index:60;opacity:0;pointer-events:none;transition:opacity .2s}
  .toast.show{opacity:1}
  @media (prefers-reduced-motion:reduce){*{transition:none !important}}
</style>
</head>
<body>

<div class="wrap" id="home">
  <div class="head">
    <span class="mark">C</span>
    <div><h1>Candy's Math</h1><p>틀린 문제만 골라 다시 풀기</p></div>
  </div>

  <div class="signal">
    <button class="lamp" id="lampRed" data-f="red" aria-pressed="false"><b id="cw">0</b><span>틀렸어요</span></button>
    <button class="lamp" id="lampAgain" data-f="again" aria-pressed="false"><b id="ca">0</b><span>아직 모르겠어요</span></button>
    <button class="lamp" id="lampGreen" data-f="green" aria-pressed="false"><b id="ck">0</b><span>이제는 알아요</span></button>
  </div>

  <button class="big" id="btnReview">다시 풀기 시작 <span class="cnt" id="revCnt"></span></button>
  <button class="big ghost" id="btnPrint">문제 뽑아 인쇄 <span class="cnt" id="printCnt"></span></button>
  <button class="big ghost" id="btnSettings">설정 <span class="cnt" id="syncBadge">동기화 · 백업</span></button>

  <div class="listhead"><span class="lt" id="listTitle">틀렸어요</span><button id="allBtn">전체 보기</button></div>
  <div class="chips" id="semFilter" style="margin-bottom:8px"></div>
  <div class="chips" id="unitFilter" style="margin-bottom:12px"></div>
  <div id="list"></div>
  <button class="more hidden" id="btnMore">더 보기</button>
</div>

<input type="file" id="jsonPick" accept="application/json,.json" class="hidden">
<div class="toast" id="toast"></div>

<div class="screen hidden" id="scReview">
  <div class="bar"><button id="revQuit">그만하기</button><span class="t" id="revPos"></span><span style="width:56px"></span></div>
  <div class="progress"><i id="revBar"></i></div>
  <div id="revBody"></div>
</div>

<div class="screen hidden" id="scDetail">
  <div class="bar"><button id="detClose">닫기</button><span class="t" id="detTitle">문제</span><span class="pos" id="detPos"></span></div>
  <div id="detBody"></div>
</div>

<div class="screen hidden" id="scPrint">
  <div class="bar"><button id="prClose">닫기</button><span class="t">문제 뽑아 인쇄</span><span style="width:40px"></span></div>
  <div class="chips" id="prQuick" style="margin-bottom:8px"></div>
  <label class="f2">한 장에 넣을 문제 수</label>
  <div class="chips" id="prPer"></div>
  <label class="f2">답지</label>
  <div class="chips" id="prAns"></div>
  <label class="f2" id="prPool"></label>
  <div id="prList"></div>
  <div class="stick"><button id="prGo">인쇄하기</button></div>
</div>

<div id="printArea"></div>

<div class="screen hidden" id="scSet">
  <div class="bar"><button id="setClose">닫기</button><span class="t">설정</span><span style="width:40px"></span></div>

  <label class="f2">기기 동기화</label>
  <div class="chips" id="syncToggle"></div>
  <label class="f2">동기화 코드 <span style="opacity:.7">(두 기기에 같은 코드를 넣습니다)</span></label>
  <input type="text" id="syncCode" placeholder="예: candy-2026" autocapitalize="off" autocorrect="off" spellcheck="false">
  <button class="big ghost" id="syncNow" style="margin-top:10px">지금 동기화 <span class="cnt" id="syncWhen"></span></button>
  <p class="note" id="syncMsg">동기화를 켜면 푼 기록이 같은 코드를 쓰는 기기끼리 자동으로 맞춰집니다. 끄면 이 기기 안에만 저장됩니다.</p>

  <label class="f2">다시 풀기 순서</label>
  <div class="chips" id="orderPick"></div>

  <label class="f2">백업</label>
  <button class="big ghost" id="doExport">파일로 내보내기 <span class="cnt">.json</span></button>
  <button class="big ghost" id="doImport">파일에서 불러오기 <span class="cnt">합치기</span></button>
  <p class="note" id="statTxt"></p>

  <button class="danger" id="wipe">푼 기록 전체 지우기</button>
</div>

<script>
(function(){
"use strict";
function fr(a,b){return '<span class="f"><i>'+a+'</i><i>'+b+'</i></span>'}
function mx(w,a,b){return w+fr(a,b)}

var SEED=[
{n:1,u:'곱셈',t:'0의 개수와 곱의 관계',s:'5번 (1)',q:`□ 안에 알맞은 수를 써넣으세요.<br>5 × □ = 350<br>5 × □ = 3500<br>50 × □ = 3500`},
{n:2,u:'곱셈',t:'곱하는 수를 쪼개어 계산하기',s:'10번',q:`□ 안에 알맞은 수를 써넣으세요.<br>16 × 15 = 16 × □ × 3<br>= □ × 3<br>= □`},
{n:3,u:'곱셈',t:'(두 자리 수) × (두 자리 수)',s:'(2)번',q:`□ 안에 알맞은 수를 써넣으세요.<br>54 × 38 = 54 × 30 + 54 × □<br>= □ + □<br>= □`},
{n:4,u:'곱셈',t:'세로셈 빈칸 채우기',s:'5번',q:`□ 안에 알맞은 수를 써넣으세요.<pre class="v">   2 □ 6
×      3
─────────
   7 3 8</pre>`},
{n:5,u:'곱셈',t:'자릿값으로 나타낸 수의 곱',s:'23번',q:`다음이 나타내는 수와 39의 곱을 구하세요.<div class="bx">10이 6개, 1이 2개인 수</div>`},
{n:6,u:'곱셈',t:'부등식에 들어갈 수의 개수',s:'2번 (서술형)',q:`1부터 9까지의 수 중에서 □ 안에 들어갈 수 있는 수는 모두 몇 개인지 풀이 과정을 쓰고 답을 구해 보세요.<div class="bx">146 × □ &lt; 600</div>`},
{n:7,u:'곱셈',t:'□ 안에 들어갈 수 구하기',s:'15번',q:`1부터 9까지의 수 중에서 □ 안에 들어갈 수 있는 가장 작은 수를 구해 보세요.<div class="bx">78 × □0 &gt; 5000</div>`},
{n:8,u:'곱셈',t:'가장 큰 수와 가장 작은 수의 곱',s:'22번',q:`가장 큰 수와 가장 작은 수의 곱을 구하세요.<div class="bx">81　　27　　42</div>`},
{n:9,u:'곱셈',t:'곱이 가장 큰 곱셈식 만들기',s:'17번',q:`수 카드 3장을 □ 안에 한 번씩만 써넣어 곱이 가장 큰 곱셈식을 만들고, 계산해 보세요.<div class="bx">5　2　7</div><pre class="v">     □
×  □ □</pre>`},
{n:10,u:'곱셈',t:'곱이 가장 큰 곱셈식 만들기',s:'9번',q:`4장의 수 카드를 한 번씩만 사용하여 계산 결과가 가장 큰 곱셈식을 만들고 곱을 구해 보세요.<div class="bx">8　4　6　3</div>□□ × □□ = □`},
{n:11,u:'곱셈',t:'자리가 정해진 곱셈식에서 곱이 가장 클 때',s:'진도책 7번',q:`3장의 수 카드 3, 5, 7을 한 번씩만 사용하여 아래와 같은 곱셈식을 만들려고 합니다. 계산 결과가 가장 클 때의 곱을 구하세요.<div class="bx">□□ × 4□</div>`},
{n:12,u:'곱셈',t:'곱이 가장 작은 곱셈식 만들기',s:'18번',q:`수 카드 3장을 □ 안에 한 번씩만 써넣어 곱이 가장 <b>작은</b> 곱셈식을 만들고, 계산해 보세요.<div class="bx">9　3　5</div><pre class="v">     □
×  □ □</pre>`},
{n:13,u:'곱셈',t:'곱이 가장 작은 곱셈식 만들기',s:'4-1 (서술형)',q:`4장의 수 카드를 한 번씩만 사용하여 (몇십몇) × (몇십몇)을 만들려고 합니다. 만들 수 있는 곱셈 중에서 가장 작은 곱은 얼마인지 풀이 과정을 쓰고 답을 구해 보세요.<div class="bx">4　7　5　2</div>`},

{n:64,u:'나눗셈',t:'겹쳐 이어 붙일 때 겹친 길이 구하기',s:'57쪽 4번 (서술형)',q:`길이가 25 cm인 색 테이프 10장을 일정한 길이만큼씩 겹쳐서 이어 붙였더니 전체 길이가 160 cm가 되었습니다. 몇 cm씩 겹쳐서 이어 붙였는지 풀이 과정을 쓰고 답을 구해 보세요.`},
{n:65,u:'나눗셈',t:'두 종류 구슬의 무게 구하기',s:'58쪽 9번 (서술형)',q:`노란 구슬 3개의 무게의 합은 39 g이고, 노란 구슬 4개와 파란 구슬 3개의 무게의 합은 97 g입니다. 파란 구슬 한 개의 무게는 몇 g인지 풀이 과정을 쓰고 답을 구해 보세요.`},
{n:66,u:'나눗셈',t:'1분에 만드는 개수의 차로 시간 구하기',s:'58쪽 10번',q:`장난감을 ㉮ 기계는 2분 동안 30개, ㉯ 기계는 4분 동안 48개 만듭니다. 두 기계를 동시에 켜서 ㉮ 기계가 ㉯ 기계보다 90개 더 많이 만들었을 때 껐습니다. 두 기계가 동시에 켜져 있던 시간은 몇 분일까요?`},
{n:67,u:'나눗셈',t:'주를 날수로 바꾼 뒤 두 사람으로 나누기',s:'57쪽 6번',q:`새롬이와 영진이는 5주 동안 종이배를 980개 접었습니다. 두 사람이 하루에 접은 종이배의 수는 일정하고 서로 같다면 새롬이가 하루에 접은 종이배는 몇 개일까요?`},
{n:68,u:'나눗셈',t:'원 모양 둘레에 일정한 간격으로 세우기',s:'53쪽 7-1',q:`둘레의 길이가 80 m인 원 모양의 호수 둘레에 5 m 간격으로 가로등을 세우려고 합니다. 가로등은 모두 몇 개 필요할까요?`},
{n:69,u:'나눗셈',t:'직사각형 둘레를 구한 뒤 말뚝 수 구하기',s:'57쪽 7번',q:`가로 18 m, 세로 12 m인 직사각형 모양의 땅의 둘레에 말뚝을 박아 울타리를 만들려고 합니다. 말뚝 사이의 간격을 3 m로 한다면 말뚝은 모두 몇 개 필요할까요? (꼭짓점에는 반드시 말뚝을 박습니다.)`},
{n:70,u:'나눗셈',t:'곧은 길 한쪽에 세우는 개수',s:'진도책 3번',q:`길이가 91 m인 길의 한쪽에 7 m 간격으로 처음부터 끝까지 가로등을 세우려고 합니다. 필요한 가로등은 모두 몇 개인가요?`},
{n:71,u:'나눗셈',t:'곧은 길 양쪽에 세우는 개수',s:'53쪽 7-2 (서술형)',q:`길이가 351 m인 곧게 뻗은 도로의 <b>양쪽</b>에 9 m 간격으로 안내판을 세우려고 합니다. 처음부터 끝까지 세운다면 안내판은 모두 몇 개 필요한지 풀이 과정을 쓰고 답을 구해 보세요.`},

{n:73,u:'나눗셈',t:'나무 사이마다 말뚝 박기 (2단계)',s:'53쪽 7-4',q:`둘레가 300 m인 원 모양 목장 둘레에 나무 5그루를 일정한 간격으로 심은 다음, 나무와 나무 사이에 말뚝을 3 m 간격으로 박으려고 합니다. 나무를 심은 곳에는 말뚝을 박지 않는다면 말뚝은 모두 몇 개 필요할까요?`},

{n:74,u:'원',t:'지름과 반지름 비교하기',s:'12번',q:`크기가 가장 큰 원을 찾아 기호를 써 보세요.<div class="bx">㉠ 지름이 8 cm인 원　㉡ 지름이 7 cm인 원<br>㉢ 반지름이 6 cm인 원　㉣ 반지름이 4 cm인 원</div>`},
{n:75,u:'원',t:'설명을 읽고 원의 크기 순서 정하기',s:'1-3',q:`세 사람이 각자 원을 그렸습니다. 큰 원을 그린 사람부터 차례로 이름을 써 보세요.<div class="bx">민주: 한 점에서 8 cm 거리의 점들을 찍어 원을 그렸어.<br>성환: 한 변이 14 cm인 정사각형 안에 꼭 맞게 원을 그렸어.<br>유라: 원의 중심을 지나면서 원 위의 두 점을 이은 선분이 9 cm인 원을 그렸어.</div>`},
{n:76,u:'원',t:'지름과 반지름의 성질',s:'6번',q:`원에 대한 설명으로 <b>틀린 것</b>을 모두 고르세요.<div class="bx">① 한 원에서 지름의 길이는 모두 같습니다.<br>② 한 원에서 반지름은 지름의 2배입니다.<br>③ 원의 지름은 원을 둘로 똑같이 나눕니다.<br>④ 한 원에서 지름은 셀 수 없이 많이 그을 수 있습니다.<br>⑤ 원의 반지름은 원 안에 그을 수 있는 가장 긴 선분입니다.</div>`},
{n:77,u:'원',t:'지름·반지름 설명에서 틀린 것 모두 찾기',s:'1-4',g:1,q:`왼쪽 원에 대한 설명입니다. 틀린 것을 모두 찾아 기호를 써 보세요.<div class="bx">㉠ 원의 지름은 선분 ㄴㅂ으로 10 cm입니다.<br>㉡ 원의 반지름을 나타내는 선분은 모두 3개입니다.<br>㉢ 선분 ㄷㅁ의 길이는 4 cm보다 길고 8 cm보다 짧습니다.<br>㉣ 원을 똑같이 둘로 나누는 선분의 길이는 8 cm입니다.</div><div class="fg">그림: 중심이 ㅇ인 원 위에 점 ㄱ~ㅂ이 있습니다. 중심에서 원까지 그은 선분(반지름)이 4 cm, 중심을 지나지 않는 다른 선분이 6 cm로 표시되어 있습니다.</div>`},
{n:78,u:'원',t:'정사각형 안에 가장 큰 원',s:'4번',q:`한 변의 길이가 16 cm인 정사각형 안에 가장 큰 원을 그렸습니다. 그린 원의 반지름은 몇 cm인지 구해 보세요.`},
{n:79,u:'원',t:'지름과 반지름의 관계',s:'16번',g:1,q:`큰 원의 지름이 24 cm입니다. 작은 원의 반지름은 몇 cm일까요?<div class="fg">그림: 큰 원 안에 작은 원 하나가 큰 원의 중심을 지나며 안쪽으로 맞닿게 그려져 있음(작은 원의 지름 = 큰 원의 반지름)</div>`},
{n:80,u:'원',t:'큰 원과 작은 원의 관계',s:'6번',g:1,q:`큰 원의 지름이 16 cm일 때 작은 원의 반지름은 몇 cm일까요? (작은 원은 크기가 같습니다.)<div class="fg">그림: 큰 원 안에 크기가 같은 작은 원 2개가 위아래로 맞닿아 들어 있음</div>`},
{n:81,u:'원',t:'반지름이 일정하게 늘어나는 원의 지름',s:'3-1',q:`원의 중심은 같고, 반지름이 2 cm씩 늘어나는 규칙으로 원을 그리려고 합니다. 가장 안쪽 원의 반지름이 2 cm일 때, 원을 모두 6개 그렸다면 가장 큰 원의 지름은 몇 cm인가요?`},
{n:82,u:'원',t:'순서도를 따라 원의 지름 구하기',s:'대표문제 1',q:`다음 순서도에 반지름 8 cm를 입력했을 때 그려지는 원의 지름은 몇 cm인가요?<div class="bx">시작 → 반지름을 입력<br>→ 반지름이 10 cm보다 긴가요?<br>아니요: 반지름에 5 cm를 더합니다 (다시 물음으로)<br>예: 원을 그립니다 → 끝</div>`},
{n:83,u:'원',t:'맞닿은 두 원과 선분의 길이',s:'28번',g:1,q:`선분 ㄱㄴ의 길이는 몇 cm인가요?<div class="fg">그림: 반지름 5 cm인 원과 반지름 8 cm인 원이 옆으로 맞닿아 있고, 선분 ㄱㄴ은 왼쪽 원의 왼쪽 끝에서 오른쪽 원의 오른쪽 끝까지</div>`},
{n:84,u:'원',t:'맞닿은 원 3개와 선분의 길이',s:'29번',g:1,q:`크기가 같은 원 3개를 맞닿게 그린 것입니다. 선분 ㄱㄴ의 길이는 몇 cm인가요?<div class="fg">그림: 같은 원 3개가 옆으로 나란히 맞닿아 있고 반지름이 1 cm로 표시됨. 선분 ㄱㄴ은 맨 왼쪽 끝에서 맨 오른쪽 끝까지</div>`},
{n:85,u:'원',t:'맞닿은 세 원의 중심 사이의 거리',s:'19번 (서술형)',g:1,q:`점 ㄱ, 점 ㄴ, 점 ㄷ은 각각 원의 중심입니다. 선분 ㄱㄷ의 길이는 몇 cm인지 풀이 과정을 쓰고 답을 구하세요.<div class="fg">그림: 반지름 4 cm, 6 cm, 10 cm인 원 3개가 옆으로 나란히 맞닿아 있음</div>`},
{n:86,u:'원',t:'겹쳐 그린 원에서 반지름 구하기',s:'16번',g:1,q:`크기가 같은 원 5개를 서로 원의 중심을 지나도록 겹치게 그렸습니다. 선분 ㄱㄴ의 길이가 42 cm일 때 원의 반지름은 몇 cm인가요?<div class="fg">그림: 같은 원 5개가 옆 원의 중심을 지나도록 겹쳐 한 줄로 그려져 있고, ㄱㄴ은 전체의 왼쪽 끝에서 오른쪽 끝까지</div>`},
{n:87,u:'원',t:'크기가 다른 네 원에서 중심 사이의 거리',s:'응용력 13번',g:1,q:`점 ㄱ, ㄴ, ㄷ, ㄹ은 각각 원의 중심입니다. 선분 ㄱㄹ의 길이는 몇 cm인가요?<div class="fg">그림: 크기가 다른 원 4개가 겹쳐 있고 가장 큰 원의 지름이 12 cm. 작은 원 3개는 서로 크기가 같고 큰 원 안쪽에 맞닿아 있음</div>`},
{n:88,u:'원',t:'세 원의 중심을 이은 삼각형의 변의 합',s:'대표문제 4',g:1,q:`세 원을 맞닿게 그린 후 세 원의 중심을 이었습니다. 삼각형 ㄱㄴㄷ의 세 변의 길이의 합은 몇 cm인가요?<div class="fg">그림: 반지름이 각각 5 cm, 4 cm, 3 cm인 원 3개가 서로 맞닿아 있고 중심을 이어 삼각형을 만듦</div>`},
{n:89,u:'원',t:'겹쳐진 두 원에서 삼각형의 세 변의 합',s:'응용력 14번',g:1,q:`점 ㄴ, 점 ㄷ은 각각 원의 중심입니다. 삼각형 ㄱㄴㄷ의 세 변의 길이의 합은 몇 cm인가요?<div class="fg">그림: 반지름 7 cm인 원과 반지름 9 cm인 원이 겹쳐 있고, 겹친 부분의 선분 ㄹㅁ이 3 cm. 점 ㄱ은 두 원이 만나는 위쪽 점</div>`},
{n:90,u:'원',t:'원 6개로 만든 삼각형의 둘레에서 지름 구하기',s:'응용력 11번',g:1,q:`크기가 같은 원 6개의 중심을 이어 세 변의 길이가 같은 삼각형을 만들었습니다. 삼각형의 세 변의 길이의 합이 24 cm일 때 한 원의 지름은 몇 cm인가요?<div class="fg">그림: 같은 원 6개가 삼각형 모양으로 쌓여 있고(위 1개, 가운데 2개, 아래 3개) 세 꼭짓점 원의 중심을 이음</div>`},
{n:91,u:'원',t:'직사각형의 네 변의 길이의 합',s:'17번',g:1,q:`직사각형 안에 크기가 같은 원 3개를 그렸습니다. 원의 지름이 6 cm일 때 직사각형의 네 변의 길이의 합은 몇 cm일까요?<div class="fg">그림: 직사각형 안에 같은 원 3개가 옆으로 나란히 꼭 맞게 들어 있음</div>`},
{n:92,u:'원',t:'직사각형의 둘레와 반지름으로 남은 변 구하기',s:'응용력 15번',g:1,q:`직사각형 ㄱㄴㄷㄹ 안에 점 ㄱ과 점 ㄹ을 각각 원의 중심으로 하는 원의 일부분을 2개 그렸습니다. 직사각형의 네 변의 길이의 합이 40 cm일 때 선분 ㅁㄹ의 길이는 몇 cm인가요?<div class="fg">그림: 직사각형의 세로가 8 cm. 점 ㄱ을 중심으로 한 사분원과 점 ㄹ을 중심으로 한 사분원이 직사각형 안에 그려져 있고, ㅁ은 위쪽 변 위의 점</div>`},

{n:95,u:'원',t:'직사각형의 둘레에서 정사각형의 둘레 구하기',s:'67쪽 2-4',g:1,q:`원 안에 직사각형을 그리고, 원 밖에 정사각형을 그린 것입니다. 직사각형의 둘레는 28 cm이고 선분 ㄱㄹ은 선분 ㄱㄴ보다 2 cm 더 깁니다. 선분 ㄱㅇ이 선분 ㄱㄴ보다 1 cm 더 짧을 때 정사각형의 둘레는 몇 cm일까요?<div class="fg">그림: 정사각형 안에 꼭 맞는 원, 그 원 안에 직사각형 ㄱㄴㄷㄹ. ㅇ은 원의 중심</div>`},
{n:96,u:'원',t:'컴퍼스의 침을 꽂는 곳',s:'6번',g:1,q:`주어진 모양을 그릴 때 컴퍼스의 침을 꽂아야 할 곳은 몇 군데인지 구해 보세요.<div class="fg">그림: 모눈 위에 큰 원 하나가 있고, 그 안에 네 방향에서 그린 곡선 4개가 만나 별 모양을 이룹니다.</div>`},

a":"6"},"55":{"h":"같은 모양은 같은 수입니다. 먼저 ●를 구한 뒤 두 번째 식에 넣습니다.","a":"3 (●=6, 87÷6=14…3)"},"56":{"h":"두 식을 각각 계산해 ●와 ◆를 구한 뒤 큰 수에서 작은 수를 뺍니다.","a":"17 (21−4)"},"57":{"h":"몇 접시가 필요한지 먼저 나눗셈으로 구합니다. 56÷4=14.","a":"20개입 — 14접시가 필요해서 10개입으로는 모자랍니다"},"58":{"h":"몫을 크게 하려면 나누는 수를 가장 작게, 나누어지는 수를 가장 크게 만듭니다.","a":"754÷3 → 몫 251, 나머지 1"},"59":{"h":"잘못한 식으로 어떤 수를 먼저 구합니다. 6×15+3=93.","a":"몫 11, 나머지 5"},"60":{"h":"나머지를 빼고 나누면 사람 수가 나옵니다((66−3)÷9=7명). 그다음 30개를 7명에게 나눕니다.","a":"5개"},"61":{"h":"철사 전체 길이를 모양의 둘레 칸 수로 나누면 한 칸의 길이가 나옵니다.","a":"27 (■=13, ▲=14)"},"62":{"h":"정사각형의 한 변을 먼저 구하고(528÷4=132), 나눈 칸 수로 다시 나눕니다.","a":"44 cm"},"63":{"h":"가로와 세로 각각 몇 조각이 나오는지 따로 구한 뒤 곱합니다.","a":"357조각 (17×21)"},"64":{"h":"겹치지 않았을 때의 길이에서 실제 길이를 뺀 것이 겹친 길이의 합입니다. 겹친 곳은 9군데.","a":"10 cm"},"65":{"h":"먼저 노란 구슬 한 개의 무게를 구하고(39÷3), 전체에서 노란 구슬 몫을 뺍니다.","a":"15 g"},"66":{"h":"두 기계가 1분에 몇 개씩 만드는지 구해 차를 냅니다. 15−12=3.","a":"30분"},"67":{"h":"주를 날수로 바꾸고(5주=35일), 두 사람 몫을 나눈 뒤 한 사람 몫으로 다시 나눕니다.","a":"14개"},"68":{"h":"원 모양 둘레에서는 간격 수와 개수가 같습니다.","a":"16개"},"69":{"h":"먼저 둘레를 구합니다((18+12)×2=60). 둘레를 도는 경우 말뚝 수 = 간격 수.","a":"20개"},"70":{"h":"곧은 길 한쪽은 (간격 수)+1개가 필요합니다.","a":"14개"},"71":{"h":"한쪽을 먼저 구하고(39+1=40) 양쪽이므로 2배 합니다.","a":"80개"},"72":{"h":"양쪽에 20개면 한쪽은 10개, 간격은 9군데입니다.","a":"30 m"},"73":{"h":"나무 사이 간격 5군데를 먼저 구하고, 한 구간마다 말뚝 수를 구해 곱합니다.","a":"95개"},"74":{"h":"반지름은 지름의 절반입니다. 모두 지름으로 바꿔 비교하세요.","a":"㉢ (지름 12 cm)"},"75":{"h":"설명을 모두 지름으로 바꿔 비교합니다. 중심을 지나는 선분이 지름입니다.","a":"민주, 성환, 유라"},"76":{"h":"한 원에서 지름 = 반지름의 2배이고, 원 안에서 가장 긴 선분은 지름입니다.","a":"②, ⑤"},"77":{"h":"먼저 반지름을 찾습니다(4 cm). 지름은 그 2배이고, 중심을 지나지 않는 선분은 지름보다 짧습니다.","a":"㉠, ㉡ (반지름 4 cm, 지름 8 cm)"},"78":{"h":"정사각형 안에 꼭 맞는 원은 지름이 정사각형의 한 변과 같습니다.","a":"8 cm"},"79":{"h":"작은 원의 지름이 큰 원의 반지름과 같습니다.","a":"6 cm"},"80":{"h":"큰 원의 지름 안에 작은 원의 지름 2개가 들어갑니다.","a":"4 cm"},"81":{"h":"반지름이 2, 4, 6 … 으로 늘어납니다. 여섯째 원의 반지름을 구해 2배 합니다.","a":"24 cm"},"82":{"h":"조건이 참이 될 때까지 명령을 반복합니다. 8 → 13이 되어 10보다 길어집니다.","a":"26 cm"},"83":{"h":"맞닿은 두 원은 지름을 이어 붙인 것과 같습니다.","a":"26 cm (10+16)"},"84":{"h":"반지름 1 cm면 지름은 2 cm, 원 3개가 나란히 맞닿아 있습니다.","a":"6 cm"},"85":{"h":"이웃한 두 원의 중심 사이 거리는 두 반지름의 합입니다.","a":"26 cm (10+16)"},"86":{"h":"중심을 지나도록 겹치면 반지름이 하나씩 늘어납니다. 반지름 6개가 42 cm.","a":"7 cm"},"87":{"h":"큰 원의 지름에서 작은 원들의 반지름을 차례로 더하거나 빼며 따라갑니다.","a":"9 cm"},"88":{"h":"맞닿은 두 원의 중심 사이 거리는 두 반지름의 합입니다. 세 변을 각각 구해 더합니다.","a":"24 cm (9+7+8)"},"89":{"h":"겹친 부분만큼 짧아집니다. 두 반지름의 합에서 겹친 길이를 뺍니다.","a":"29 cm"},"90":{"h":"삼각형 한 변은 24÷3=8 cm이고, 그 안에 지름이 2개 들어갑니다.","a":"지름 4 cm"},"91":{"h":"가로는 지름 3개, 세로는 지름 1개입니다.","a":"48 cm (가로 18, 세로 6)"},"92":{"h":"둘레로 가로를 먼저 구한 뒤, 사분원의 반지름만큼 빼서 남은 길이를 구합니다.","a":"4 cm"},"93":{"h":"삼각형의 두 변이 반지름과 반지름 2개로 이루어집니다. 3×반지름+10=37.","a":"9 cm"},"95":{"h":"직사각형의 두 변을 먼저 구하고(6, 8), 선분 ㄱㅇ이 원의 반지름임을 이용합니다.","a":"40 cm (반지름 5, 지름 10)"},"96":{"h":"컴퍼스 침은 원의 중심마다 한 번씩 꽂습니다. 큰 원과 안쪽 곡선들을 따로 세어 보세요.","a":"5군데 (큰 원 1 + 안쪽 곡선 4)"},"97":{"h":"전체를 똑같이 4묶음으로 나누면 한 묶음이 1/4입니다. 24÷4=6.","a":"(1) 6  (2) 12  (3) 18"},"98":{"h":"전체가 몇 도막인지 먼저 구합니다(48÷8=6도막). 40 cm는 5도막.","a":"5/6"},"99":{"h":"단위를 먼저 바꿉니다. 1 m=100 cm, 1시간=60분.","a":"(1) 60 cm  (2) 50분"},"100":{"h":"1/4이 8이면 그런 묶음이 4개이므로 8×4입니다.","a":"(1) 32  (2) 63"},"101":{"h":"단위분수를 이용해 전체를 먼저 구합니다. 1/6이 5면 전체는 30.","a":"10"},"102":{"h":"3/7이 27이면 1/7은 9, 전체는 63입니다. 그다음 2/9를 구합니다.","a":"14"},"103":{"h":"사용한 길이를 먼저 구한 뒤 전체에서 뺍니다. 또는 남은 몫 4/6로 바로 구합니다.","a":"36 cm"},"104":{"h":"남은 쪽수를 먼저 구합니다(90−10=80). 오늘 읽은 양은 남은 쪽수의 분수만큼입니다.","a":"50쪽"},"105":{"h":"대분수를 가분수로 바꾸면 분자만 비교하면 됩니다.","a":"17/7"},"106":{"h":"모두 분모가 6인 가분수로 바꿔 분자를 비교합니다.","a":"시은, 건우, 민호"},"107":{"h":"대분수는 자연수 부분이 클수록 큽니다. 자연수에 가장 큰 수를 넣습니다.","a":"9와 4/5 = 49/5"},"108":{"h":"자연수 자리를 가장 크게 만든 뒤(86), 남은 두 수로 진분수를 만듭니다.","a":"86과 1/5"},"109":{"h":"가분수는 분자가 분모와 같거나 더 큰 분수입니다.","a":"8개 (1~8)"},"110":{"h":"모두 분모가 11인 가분수로 바꾸면 20/11 < □/11 < 29/11입니다.","a":"8개 (21~28)"},"111":{"h":"합이 11, 차가 3인 두 수를 찾습니다. 7과 4.","a":"4/7"},"112":{"h":"한 번 튀어 오를 때마다 3/4을 곱합니다. 32 → 24 → 18.","a":"18 m"},"113":{"h":"첫 번째와 두 번째 높이를 각각 구한 뒤 뺍니다. 64 → 40 → 25.","a":"15 m"},"114":{"h":"mL끼리 뺄 수 없으면 1 L를 1000 mL로 바꿔 받아내림합니다.","a":"4 L 300 mL"},"115":{"h":"일의 자리(g)부터 거꾸로 맞춥니다. 받아내림이 있었는지 확인하세요.","a":"300 / 4 (7 kg 300 g − 4 kg 400 g)"},"116":{"h":"g끼리 더해 1000이 넘으면 1 kg으로 받아올림합니다.","a":"서준 — 바르게 계산하면 6 kg 50 g"},"117":{"h":"모두 계산해 같은 단위로 만든 뒤 비교합니다.","a":"㉢ (6 kg 300 g)"},"118":{"h":"단위를 하나로 맞춰(mL) 비교합니다.","a":"1900 mL"},"119":{"h":"민주가 마신 양을 먼저 구한 뒤(3 L 800 mL) 두 사람 것을 더합니다.","a":"9 L 100 mL"},"120":{"h":"들이를 비교하려면 크기가 같은 컵으로 옮겨 담아야 합니다.","a":"없습니다 — 컵의 크기가 서로 다르기 때문"},"121":{"h":"단위로 쓰려면 개수마다 크기와 무게가 거의 같아야 합니다.","a":"마늘"},"122":{"h":"개수가 같아도 한 개의 무게가 다르면 전체 무게도 다릅니다.","a":"× — 동전의 종류가 달라 한 개의 무게가 다르기 때문"},"123":{"h":"먼저 당근 한 개의 무게를 구합니다(120÷2=60).","a":"180 g"},"124":{"h":"키위 4개의 무게를 먼저 구해 전체에서 뺍니다.","a":"780 g"},"125":{"h":"합에서 차를 뺀 뒤 반으로 나누면 가벼운 쪽이 나옵니다.","a":"7 kg"},"126":{"h":"표에서 한 말과 한 되를 찾아 그대로 더합니다.","a":"19 L 800 mL"},"127":{"h":"1 L는 1000 mL입니다. 1000÷200.","a":"5번"},"128":{"h":"두 그릇을 더하기만 하지 말고 덜어내는 방법도 생각해 봅니다.","a":"가 2번 부은 뒤 나 1번 덜어내기 (5000−1500=3500)"},"129":{"h":"반복 명령은 그 횟수만큼 더하는 것입니다. 1 L 900 mL를 2번.","a":"아니요 (3 L 800 mL로 넘치지 않음)"},"130":{"h":"상자까지 포함한 전체 무게를 먼저 구한 뒤 표의 구간을 봅니다.","a":"5000원 (2 kg 700 g → 3 kg까지)"},"131":{"h":"큰 그림은 10, 작은 그림은 1입니다. 종류별로 세어 모두 더합니다.","a":"167잔"},"132":{"h":"반별 학생 수를 모두 더한 뒤 4를 곱합니다.","a":"472개 (118명)"},"133":{"h":"가장 많은 사람과 가장 적은 사람을 먼저 찾아 각각 수로 바꿉니다.","a":"49회 (152−103)"}};

var PROG="suah-math-prog-v1", SET="suah-math-set-v1";
var UNITS=["곱셈","나눗셈","원","분수","들이와 무게","그림그래프"];
var SEMS=["3-1학기","3-2학기","4-1학기","4-2학기"];
var SEED_SEM="3-2학기", PAGE=25;

var prog=jload(PROG,{}), cfg=jload(SET,{order:"seq",sync:false,code:""});
var filter="red", semPick="", unitPick="", shown=PAGE;
var rev={queue:[],i:0,got:0,again:0,done:{}}, detailId=null, detailRing=[], pushTimer=null, pulling=false;

function jload(k,d){ try{ var v=JSON.parse(localStorage.getItem(k)); return v==null?d:v }catch(e){ return d } }
function saveProg(){ try{ localStorage.setItem(PROG,JSON.stringify(prog)) }catch(e){} }
function saveCfg(){ localStorage.setItem(SET,JSON.stringify(cfg)) }
function $(id){ return document.getElementById(id) }
function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]}) }
var tmr; function toast(m){ var t=$("toast"); t.textContent=m; t.classList.add("show"); clearTimeout(tmr); tmr=setTimeout(function(){t.classList.remove("show")},1900) }
function fmt(ts){ var d=new Date(ts); return (d.getMonth()+1)+"월 "+d.getDate()+"일" }
function clock(ts){ var d=new Date(ts); return ("0"+d.getHours()).slice(-2)+":"+("0"+d.getMinutes()).slice(-2) }
function show(id){ $(id).classList.remove("hidden"); document.body.style.overflow="hidden" }
function hide(id){ $(id).classList.add("hidden"); document.body.style.overflow="" }

/* 데이터 */
function lampOf(st,ag){ return st==="known"?"green":(ag>0?"again":"red") }
var LAMP={red:{n:"틀렸어요",c:"w"},again:{n:"아직 모르겠어요",c:"ag"},green:{n:"이제는 알아요",c:"kn"}};
function items(){
  return SEED.map(function(s){
    var id="s"+s.n, p=prog[id]||{}, X=EXTRA[s.n]||{}, st=p.status||"wrong", ag=p.again||0;
    return {id:id,n:s.n,sem:SEED_SEM,unit:s.u,title:s.t,src:s.s,q:s.q,fig:!!s.g,hint:X.h||"",ans:X.a||"",
      status:st,again:ag,lamp:lampOf(st,ag),wrongCount:p.wrongCount||1,last:p.last||0,order:s.n};
  });
}
function byId(id){ var a=items(); for(var i=0;i<a.length;i++) if(a[i].id===id) return a[i]; return null }
function setState(it,patch){
  var p=prog[it.id]||{}; for(var k in patch) p[k]=patch[k];
  p.last=Date.now(); prog[it.id]=p; saveProg(); schedulePush();
}

/* 동기화 */
function syncOn(){ return !!(cfg.sync && cfg.code) }
function schedulePush(){
  if(!syncOn()) return;
  clearTimeout(pushTimer);
  pushTimer=setTimeout(pushNow,1500);
}
function pushNow(cb){
  if(!syncOn()) return cb&&cb();
  fetch("/api/sync?code="+encodeURIComponent(cfg.code),{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(prog)})
    .then(function(r){ if(!r.ok) throw 0; cfg.at=Date.now(); saveCfg(); if($("syncWhen")) $("syncWhen").textContent="방금 "+clock(cfg.at); cb&&cb() })
    .catch(function(){ if($("syncMsg")) $("syncMsg").textContent="서버에 저장하지 못했습니다. 잠시 뒤 다시 시도합니다."; cb&&cb() });
}
function pullNow(cb){
  if(!syncOn()||pulling) return cb&&cb();
  pulling=true;
  fetch("/api/sync?code="+encodeURIComponent(cfg.code))
    .then(function(r){ if(!r.ok) throw 0; return r.json() })
    .then(function(j){
      var got=0;
      if(j&&j.data) for(var id in j.data){
        var r=j.data[id]||{}, l=prog[id];
        if(!l||(r.last||0)>(l.last||0)){ prog[id]=r; got++ }
      }
      if(got) saveProg();
      cfg.at=Date.now(); saveCfg(); pulling=false;
      if($("syncWhen")) $("syncWhen").textContent="방금 "+clock(cfg.at);
      renderHome(); cb&&cb(got);
    })
    .catch(function(){ pulling=false; if($("syncMsg")) $("syncMsg").textContent="서버에 연결하지 못했습니다. 코드와 인터넷 연결을 확인해 주세요."; cb&&cb(0) });
}
document.addEventListener("visibilitychange",function(){ if(!document.hidden) pullNow() });

/* 홈 */
function renderHome(){
  var a=items(),c={red:0,again:0,green:0};
  a.forEach(function(it){ c[it.lamp]++ });
  $("cw").textContent=c.red; $("ca").textContent=c.again; $("ck").textContent=c.green;
  [["lampRed","red","lit-red"],["lampAgain","again","lit-again"],["lampGreen","green","lit-green"]].forEach(function(p){
    var el=$(p[0]); el.className="lamp "+(c[p[1]]?p[2]:"off");
    el.setAttribute("aria-pressed",filter===p[1]?"true":"false");
  });
  $("listTitle").textContent=filter==="all"?"전체 문제":LAMP[filter].n;
  $("allBtn").textContent=filter==="all"?"신호등으로 고르기":"전체 보기";
  $("printCnt").textContent=visible().length+"문제 중 고르기";
  $("syncBadge").textContent=syncOn()?"동기화 켜짐 · "+cfg.code:"동기화 · 백업";
  var q=queue().length;
  $("revCnt").textContent=q?q+"문제":"없음";
  $("btnReview").disabled=!q;

  var semUsed={},unitUsed={};
  a.forEach(function(it){
    semUsed[it.sem]=(semUsed[it.sem]||0)+1;
    if(semPick&&it.sem===semPick) unitUsed[it.unit]=(unitUsed[it.unit]||0)+1;
  });
  var sf=$("semFilter"); sf.innerHTML="";
  sf.appendChild(chip("전체 학기","",semPick==="",pickSem));
  SEMS.forEach(function(s){ if(semUsed[s]) sf.appendChild(chip(s+" ("+semUsed[s]+")",s,semPick===s,pickSem)) });
  var uf=$("unitFilter"); uf.innerHTML="";
  if(semPick){
    uf.appendChild(chip("단원 전체","",unitPick==="",pickUnit));
    UNITS.forEach(function(u){ if(unitUsed[u]) uf.appendChild(chip(u+" ("+unitUsed[u]+")",u,unitPick===u,pickUnit)) });
  }
  renderList();
}
function pickSem(v){ semPick=v; unitPick=""; shown=PAGE; renderHome() }
function pickUnit(v){ unitPick=v; shown=PAGE; renderHome() }
function chip(label,val,on,fn){
  var b=document.createElement("button"); b.textContent=label; b.setAttribute("aria-pressed",on?"true":"false");
  b.onclick=function(){ fn(val) }; return b;
}
function visible(){
  return items().filter(function(it){
    if(filter!=="all"&&it.lamp!==filter) return false;
    if(semPick&&it.sem!==semPick) return false;
    if(unitPick&&it.unit!==unitPick) return false;
    return true;
  });
}
function renderList(){
  var v=visible(), el=$("list");
  if(!v.length){ el.innerHTML='<div class="empty">여기에 해당하는 문제가 없습니다.</div>'; $("btnMore").classList.add("hidden"); return }
  el.innerHTML=v.slice(0,shown).map(function(it){
    return '<button class="item l-'+it.lamp+'" data-id="'+it.id+'" aria-label="'+LAMP[it.lamp].n+'"><span class="dot"></span>'+
      '<span class="meta"><span class="unit">'+esc(it.unit)+'</span>'+
      '<span class="note">'+esc(it.title)+'</span>'+
      '<span class="date">틀린 횟수 '+it.wrongCount+'회</span></span></button>';
  }).join("");
  Array.prototype.forEach.call(el.querySelectorAll(".item"),function(b){ b.onclick=function(){ openDetail(b.dataset.id) } });
  var more=$("btnMore");
  if(v.length>shown){ more.classList.remove("hidden"); more.textContent="더 보기 ("+(v.length-shown)+"문제 남음)" }
  else more.classList.add("hidden");
}
$("btnMore").onclick=function(){ shown+=PAGE; renderList() };

/* 다시 풀기 */
function queue(){
  var q=items().filter(function(it){ return it.lamp!=="green" && (!semPick||it.sem===semPick) && (!unitPick||it.unit===unitPick) });
  if(cfg.order==="shuffle"){ for(var i=q.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=q[i]; q[i]=q[j]; q[j]=t } }
  else q.sort(function(a,b){ return (b.lamp==="again")-(a.lamp==="again") || a.order-b.order });
  return q;
}
$("btnReview").onclick=function(){
  var q=queue(); if(!q.length) return toast("다시 풀 문제가 없습니다.");
  rev={queue:q.map(function(i){return i.id}),i:0,got:0,again:0,done:{}}; show("scReview"); renderRev();
};
$("revQuit").onclick=function(){ hide("scReview"); renderHome() };
function renderRev(){
  var n=rev.queue.length;
  if(rev.i>=n){
    $("revPos").textContent=""; $("revBar").style.width="100%";
    $("revBody").innerHTML='<div class="done"><div class="big-n kn">'+rev.got+'</div><p>문제를 이제는 알게 됐습니다.</p>'+
      '<p class="note">아직 모르겠는 문제 '+rev.again+'개는 다음에 다시 나옵니다.</p><button class="big" id="revEnd" style="margin-top:20px;justify-content:center">끝내기</button></div>';
    $("revEnd").onclick=function(){ hide("scReview"); renderHome() }; return;
  }
  var it=byId(rev.queue[rev.i]); if(!it){ rev.i++; return renderRev() }
  $("revPos").textContent=(rev.i+1)+" / "+n;
  $("revBar").style.width=(rev.i/n*100)+"%";
  $("revBody").innerHTML='<div class="qwrap"><div class="qmeta"><span>'+esc(it.unit)+'</span>'+
    '<span class="'+LAMP[it.lamp].c+'">'+LAMP[it.lamp].n+'</span></div><div class="q">'+it.q+'</div></div>'+
    '<div class="reveal"><button id="rHint" aria-expanded="false">힌트 보기</button>'+
    '<button id="rAns" aria-expanded="false">답 보기</button></div>'+
    '<div id="rBoxHint" class="box-h hidden"><b>힌트</b>'+esc(it.hint)+'</div>'+
    '<div id="rBoxAns" class="box-a hidden"><b>답</b>'+esc(it.ans)+'</div>'+
    '<div class="nav"><button id="rPrev"'+(rev.i===0?" disabled":"")+'>← 이전 문제</button>'+
    '<button id="rNext">다음 문제 →</button></div>'+
    '<div class="judge"><button class="again">아직 모르겠어요</button><button class="got">이제는 알아요</button></div>';
  $("rHint").onclick=function(){ toggleBox(this,"rBoxHint","힌트") };
  $("rAns").onclick=function(){ toggleBox(this,"rBoxAns","답") };
  $("rPrev").onclick=function(){ if(rev.i>0){ rev.i--; renderRev() } };
  $("rNext").onclick=function(){ rev.i++; renderRev() };
  $("revBody").querySelector(".again").onclick=function(){ judge(it,false) };
  $("revBody").querySelector(".got").onclick=function(){ judge(it,true) };
  window.scrollTo(0,0);
}
function judge(it,ok){
  var first=!rev.done[it.id];
  rev.done[it.id]=true;
  if(ok){ setState(it,{status:"known"}); if(first) rev.got++ }
  else{ setState(it,{status:"wrong",again:it.again+1,wrongCount:it.wrongCount+1}); if(first) rev.again++ }
  rev.i++; renderRev();
}

/* 문제 카드 */
function toggleBox(btn,id,label){
  var box=$(id), open=box.classList.contains("hidden");
  box.classList.toggle("hidden",!open);
  btn.setAttribute("aria-expanded",open?"true":"false");
  btn.textContent=label+(open?" 숨기기":" 보기");
}
function openDetail(id){
  detailRing=visible().map(function(x){ return x.id });
  if(detailRing.indexOf(id)<0) detailRing=[id];
  detailId=id; renderDetail(); show("scDetail");
}
function renderDetail(){
  var it=byId(detailId); if(!it) return hide("scDetail");
  $("detTitle").textContent=it.unit;
  $("detBody").innerHTML=
    '<div class="qwrap"><div class="q">'+it.q+'</div></div>'+
    '<div class="reveal"><button id="btnHint" aria-expanded="false">힌트 보기</button>'+
    '<button id="btnAns" aria-expanded="false">답 보기</button></div>'+
    '<div id="boxHint" class="box-h hidden"><b>힌트</b>'+esc(it.hint)+'</div>'+
    '<div id="boxAns" class="box-a hidden"><b>답</b>'+esc(it.ans)+'</div>'+
    '<div class="row"><button id="dW" class="'+(it.lamp==="red"?"on-w":"")+'">틀렸어요</button>'+
    '<button id="dA" class="'+(it.lamp==="again"?"on-ag":"")+'">아직 모르겠어요</button>'+
    '<button id="dK" class="'+(it.lamp==="green"?"on-k":"")+'">이제는 알아요</button></div>'+
    '<div class="nav"><button id="dPrev">← 이전 문제</button><button id="dNext">다음 문제 →</button></div>'+
    '<div class="hist">'+esc(it.sem)+' · '+esc(it.unit)+'<br>틀린 횟수 '+it.wrongCount+'회'+
    (it.last?' · 마지막으로 푼 날 '+fmt(it.last):'')+'</div>';
  var at=detailRing.indexOf(it.id);
  $("detPos").textContent=at>=0?(at+1)+" / "+detailRing.length:"";
  $("dPrev").disabled=(at<=0);
  $("dNext").disabled=(at<0||at>=detailRing.length-1);
  $("dPrev").onclick=function(){ detailId=detailRing[at-1]; renderDetail(); window.scrollTo(0,0) };
  $("dNext").onclick=function(){ detailId=detailRing[at+1]; renderDetail(); window.scrollTo(0,0) };
  $("btnHint").onclick=function(){ toggleBox(this,"boxHint","힌트") };
  $("btnAns").onclick=function(){ toggleBox(this,"boxAns","답") };
  $("dW").onclick=function(){ setState(it,{status:"wrong",again:0}); renderDetail() };
  $("dA").onclick=function(){ setState(it,{status:"wrong",again:it.again||1}); renderDetail() };
  $("dK").onclick=function(){ setState(it,{status:"known"}); renderDetail() };
}
$("detClose").onclick=function(){ hide("scDetail"); renderHome() };

/* 설정 */
$("btnSettings").onclick=function(){ renderSet(); show("scSet") };
function renderSet(){
  var st=$("syncToggle"); st.innerHTML="";
  [[true,"켜기"],[false,"끄기"]].forEach(function(p){
    var b=document.createElement("button"); b.textContent=p[1];
    b.setAttribute("aria-pressed",(!!cfg.sync)===p[0]?"true":"false");
    b.onclick=function(){
      if(p[0]&&!$("syncCode").value.trim()) return toast("동기화 코드를 먼저 넣어 주세요.");
      cfg.sync=p[0]; cfg.code=$("syncCode").value.trim(); saveCfg(); renderSet(); renderHome();
      if(p[0]) pullNow(function(){ pushNow(); toast("동기화를 켰습니다.") }); else toast("동기화를 껐습니다.");
    };
    st.appendChild(b);
  });
  $("syncCode").value=cfg.code||"";
  $("syncWhen").textContent=cfg.at?clock(cfg.at):"";
  var o=$("orderPick"); o.innerHTML="";
  [["seq","번호 순서대로"],["shuffle","섞어서"]].forEach(function(p){
    var b=document.createElement("button"); b.textContent=p[1];
    b.setAttribute("aria-pressed",(cfg.order||"seq")===p[0]?"true":"false");
    b.onclick=function(){ cfg.order=p[0]; saveCfg(); renderSet() }; o.appendChild(b);
  });
  var done=0,cnt=0; items().forEach(function(it){ if(it.lamp==="green") done++; if(it.last) cnt++ });
  $("statTxt").textContent="문제 "+SEED.length+"개 · 푼 기록 "+cnt+"개 · 이제는 알아요 "+done+"개";
}
$("syncCode").onchange=function(){ if(cfg.sync){ cfg.code=this.value.trim(); saveCfg(); renderHome() } };
$("syncNow").onclick=function(){
  if(!syncOn()) return toast("먼저 동기화를 켜 주세요.");
  $("syncMsg").textContent="동기화하는 중…";
  pullNow(function(){ pushNow(function(){ $("syncMsg").textContent="맞췄습니다. 두 기기의 기록이 같아졌습니다."; renderSet() }) });
};
$("setClose").onclick=function(){ hide("scSet"); renderHome() };
$("doExport").onclick=function(){
  var blob=new Blob([JSON.stringify({v:3,prog:prog})],{type:"application/json"});
  var a=document.createElement("a"); a.href=URL.createObjectURL(blob);
  a.download="CandysMath_"+new Date().toISOString().slice(0,10)+".json"; a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href) },2000);
};
$("doImport").onclick=function(){ $("jsonPick").click() };
$("jsonPick").onchange=function(e){
  var f=e.target.files[0]; e.target.value=""; if(!f) return;
  var r=new FileReader();
  r.onload=function(){
    try{
      var d=JSON.parse(r.result), src=d.prog||{}, got=0;
      for(var id in src){ var l=prog[id]; if(!l||((src[id].last||0)>(l.last||0))){ prog[id]=src[id]; got++ } }
      saveProg(); schedulePush(); renderSet(); renderHome(); toast(got+"개 기록을 합쳤습니다.");
    }catch(err){ toast("파일을 읽지 못했습니다.") }
  };
  r.readAsText(f);
};
$("wipe").onclick=function(){
  if(!confirm("푼 기록을 모두 지웁니다. 되돌릴 수 없습니다.")) return;
  prog={}; saveProg(); schedulePush(); hide("scSet"); renderHome(); toast("모두 지웠습니다.");
};


/* 인쇄 */
var sel={}, prCfg=jload("candymath-print",{per:4,ans:true});
$("btnPrint").onclick=function(){
  sel={}; visible().forEach(function(it){ sel[it.id]=true }); renderPrint(); show("scPrint");
};
$("prClose").onclick=function(){ hide("scPrint") };
function selCount(){ var n=0; for(var k in sel) if(sel[k]) n++; return n }
function renderPrint(){
  var v=visible();
  $("prPool").textContent="지금 목록의 "+v.length+"문제 중에서 고릅니다 (홈에서 신호등·단원을 바꾸면 목록이 달라집니다)";
  var q=$("prQuick"); q.innerHTML="";
  [["all","모두 선택"],["none","모두 해제"]].forEach(function(p){
    var b=document.createElement("button"); b.textContent=p[1];
    b.onclick=function(){ v.forEach(function(it){ sel[it.id]=(p[0]==="all") }); renderPrint() };
    q.appendChild(b);
  });
  var pp=$("prPer"); pp.innerHTML="";
  [[2,"2문제"],[4,"4문제"],[6,"6문제"]].forEach(function(p){
    var b=document.createElement("button"); b.textContent=p[1];
    b.setAttribute("aria-pressed",prCfg.per===p[0]?"true":"false");
    b.onclick=function(){ prCfg.per=p[0]; localStorage.setItem("candymath-print",JSON.stringify(prCfg)); renderPrint() };
    pp.appendChild(b);
  });
  var pa=$("prAns"); pa.innerHTML="";
  [[true,"마지막 장에 답지 넣기"],[false,"문제만"]].forEach(function(p){
    var b=document.createElement("button"); b.textContent=p[1];
    b.setAttribute("aria-pressed",(!!prCfg.ans)===p[0]?"true":"false");
    b.onclick=function(){ prCfg.ans=p[0]; localStorage.setItem("candymath-print",JSON.stringify(prCfg)); renderPrint() };
    pa.appendChild(b);
  });
  $("prList").innerHTML=v.map(function(it){
    return '<button class="pick l-'+it.lamp+'" data-id="'+it.id+'" aria-pressed="'+(sel[it.id]?"true":"false")+'">'+
      '<span class="chk">✓</span><span class="dot"></span>'+
      '<span class="meta"><span class="unit">'+esc(it.unit)+'</span><span class="note">'+esc(it.title)+'</span></span></button>';
  }).join("");
  Array.prototype.forEach.call($("prList").querySelectorAll(".pick"),function(b){
    b.onclick=function(){ sel[b.dataset.id]=!sel[b.dataset.id]; b.setAttribute("aria-pressed",sel[b.dataset.id]?"true":"false"); updateGo() };
  });
  updateGo();
}
function updateGo(){
  var n=selCount();
  $("prGo").textContent=n?n+"문제 인쇄하기":"문제를 골라 주세요";
  $("prGo").disabled=!n;
}
$("prGo").onclick=function(){
  var list=items().filter(function(it){ return sel[it.id] });
  if(!list.length) return;
  var gap={2:"62mm",4:"26mm",6:"11mm"}[prCfg.per]||"26mm";
  var d=new Date(), day=(d.getMonth()+1)+"월 "+d.getDate()+"일";
  var where=(semPick||"3-2학기")+(unitPick?" · "+unitPick:"");
  var html='<div class="p-head"><b>Candy\'s Math</b><span>'+esc(where)+' · '+list.length+'문제 · '+day+'</span></div>';
  html+=list.map(function(it,i){
    return '<div class="p-item"><div class="q"><span class="p-no">'+(i+1)+'.</span>'+it.q+
      '</div><div style="height:'+gap+'"></div></div>';
  }).join("");
  if(prCfg.ans){
    html+='<div class="p-ans"><div class="p-head"><b>답</b><span>'+esc(where)+' · '+day+'</span></div><ol>'+
      list.map(function(it){ return '<li>'+esc(it.ans)+'</li>' }).join("")+'</ol></div>';
  }
  $("printArea").innerHTML=html;
  setTimeout(function(){ window.print() },60);
};

Array.prototype.forEach.call(document.querySelectorAll(".lamp"),function(b){
  b.onclick=function(){ filter=b.dataset.f; shown=PAGE; renderHome() };
});
$("allBtn").onclick=function(){ filter=(filter==="all"?"red":"all"); shown=PAGE; renderHome() };

renderHome();
if(syncOn()) pullNow();
})();
</script>
</body>

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F7F7F2">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>수아 오답 노트</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  :root{
    --paper:#F7F7F2; --grid:#E2E5DC; --ink:#23282B; --ink-soft:#6B7278;
    --line:#D8DBD2; --wrong:#D94F45; --known:#2E8F63; --act:#2F5FD0;
    --card:#FFFFFF; --radius:14px; --safe-b:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
    color:var(--ink); background-color:var(--paper);
    background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
    background-size:22px 22px; font-size:16px; line-height:1.5; -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:560px;margin:0 auto;padding:16px 16px calc(96px + var(--safe-b))}
  h1{font-size:20px;font-weight:700;margin:4px 0 2px;letter-spacing:-0.02em}
  .sub{color:var(--ink-soft);font-size:13px;margin-bottom:16px}
  button{font-family:inherit;font-size:inherit;cursor:pointer;border:none;background:none;color:inherit}
  .hidden{display:none !important}

  .tally{display:flex;gap:10px;margin-bottom:12px}
  .tally div{flex:1;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px}
  .tally .n{font-size:26px;font-weight:700;letter-spacing:-0.03em;line-height:1.1}
  .tally .k{font-size:12px;color:var(--ink-soft);margin-top:2px}
  .w{color:var(--wrong)} .kn{color:var(--known)}

  .big{display:flex;align-items:center;justify-content:space-between;width:100%;
    background:var(--ink);color:#fff;border-radius:var(--radius);padding:18px;font-size:17px;font-weight:600;margin-bottom:10px}
  .big.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}
  .big .cnt{font-size:14px;font-weight:500;opacity:.75}
  .big:disabled{opacity:.4}

  .tabs{display:flex;gap:6px;margin:18px 0 10px}
  .tabs button{padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:14px;color:var(--ink-soft)}
  .tabs button[aria-selected="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chips button{padding:8px 12px;border:1px solid var(--line);border-radius:999px;background:var(--card);font-size:14px}
  .chips button[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}

  .item{display:flex;gap:11px;align-items:stretch;width:100%;text-align:left;
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:10px;margin-bottom:8px}
  .item .no{flex:none;width:38px;height:38px;border-radius:10px;background:var(--paper);border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:var(--ink-soft)}
  .item img{width:52px;height:52px;object-fit:cover;border-radius:10px;background:#EEE;flex:none}
  .item .meta{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:3px}
  .item .top{display:flex;align-items:center;gap:6px}
  .unit{font-size:13px;font-weight:600}
  .item .note{font-size:13px;color:var(--ink-soft);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .item .date{font-size:11px;color:var(--ink-soft)}
  .badge{font-size:11px;padding:2px 7px;border-radius:999px;border:1px solid currentColor;flex:none}
  .empty{padding:40px 12px;text-align:center;color:var(--ink-soft);font-size:14px;line-height:1.7}
  .more{width:100%;padding:14px;border:1px solid var(--line);border-radius:var(--radius);background:var(--card);color:var(--ink-soft);font-size:14px}

  .screen{position:fixed;inset:0;background:var(--paper);z-index:20;overflow-y:auto;padding:14px 16px calc(20px + var(--safe-b))}
  .bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
  .bar .t{font-weight:700}
  .bar button{font-size:15px;color:var(--act);font-weight:600;padding:6px 2px}
  label.f2{display:block;font-size:13px;color:var(--ink-soft);margin:14px 0 6px}
  input[type=text],select{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--card);font-family:inherit;font-size:16px;color:var(--ink)}
  .thumbs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
  .thumbs figure{position:relative;margin:0}
  .thumbs img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px}
  .thumbs button{position:absolute;top:4px;right:4px;width:24px;height:24px;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;font-size:14px;line-height:24px;text-align:center}
  .primary{width:100%;padding:16px;border-radius:var(--radius);background:var(--act);color:#fff;font-weight:600;margin-top:22px}
  .primary:disabled{opacity:.4}
  .danger{color:var(--wrong);font-weight:600;padding:12px 0;width:100%;text-align:center;margin-top:8px}

  .progress{height:4px;background:var(--line);border-radius:2px;overflow:hidden;margin-bottom:12px}
  .progress i{display:block;height:100%;background:var(--ink);transition:width .25s}
  .qwrap{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px 15px;margin-bottom:14px}
  .qwrap img{width:100%;border-radius:8px;display:block}
  .qmeta{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-soft);margin-bottom:10px}
  .judge{display:flex;gap:10px;position:sticky;bottom:calc(10px + var(--safe-b))}
  .judge button{flex:1;padding:18px 10px;border-radius:var(--radius);font-size:17px;font-weight:700;color:#fff}
  .judge .again{background:var(--wrong)} .judge .got{background:var(--known)}
  .done{text-align:center;padding:60px 10px}
  .done .big-n{font-size:44px;font-weight:700;letter-spacing:-0.03em}

  /* 문제 본문 */
  .q{font-size:17px;line-height:1.75}
  .f{display:inline-flex;flex-direction:column;vertical-align:-0.5em;text-align:center;line-height:1.1;margin:0 3px;font-size:.85em}
  .f i{font-style:normal;display:block;padding:0 3px}
  .f i:first-child{border-bottom:1.5px solid currentColor}
  pre.v{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:16px;line-height:1.5;margin:10px 0;white-space:pre}
  .bx{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:10px 0;font-size:15px;background:var(--paper)}
  .fg{margin:10px 0;padding:9px 12px;border-left:3px solid var(--act);background:var(--paper);font-size:14px;color:var(--ink-soft);line-height:1.6}
  .ans{margin-top:12px;color:var(--ink-soft);font-size:14px}

  .full img{width:100%;border-radius:12px;border:1px solid var(--line);background:#fff}
  .row{display:flex;gap:8px;margin-top:14px}
  .row button{flex:1;padding:14px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-weight:600}
  .row button.on-w{background:var(--wrong);color:#fff;border-color:var(--wrong)}
  .row button.on-k{background:var(--known);color:#fff;border-color:var(--known)}
  .hist{font-size:12px;color:var(--ink-soft);margin-top:14px;line-height:1.8}

  .meter{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:6px 0 4px}
  .meter i{display:block;height:100%;background:var(--act)}
  .note{font-size:13px;color:var(--ink-soft);line-height:1.7;margin-top:10px}

  .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + var(--safe-b));background:var(--ink);color:#fff;
    padding:11px 18px;border-radius:999px;font-size:14px;z-index:60;opacity:0;pointer-events:none;transition:opacity .2s}
  .toast.show{opacity:1}
  .fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + var(--safe-b));background:var(--act);color:#fff;
    padding:15px 26px;border-radius:999px;font-weight:600;box-shadow:0 6px 18px rgba(47,95,208,.3);z-index:10}
  @media (prefers-reduced-motion:reduce){*{transition:none !important}}
</style>
</head>
<body>

<div class="wrap" id="home">
  <h1>수아 오답 노트</h1>
  <p class="sub">틀린 문제만 골라 다시 풉니다.</p>

  <div class="tally">
    <div><div class="n w" id="cw">0</div><div class="k">다시 풀 문제 △</div></div>
    <div><div class="n kn" id="ck">0</div><div class="k">알게 된 문제 ○</div></div>
  </div>

  <button class="big" id="btnReview">다시 풀기 시작 <span class="cnt" id="revCnt"></span></button>
  <button class="big ghost" id="btnSettings">백업과 설정 <span class="cnt">내보내기 · 불러오기</span></button>

  <div class="tabs" role="tablist">
    <button role="tab" data-f="wrong" aria-selected="true">틀린 문제</button>
    <button role="tab" data-f="known" aria-selected="false">알게 된 문제</button>
    <button role="tab" data-f="all" aria-selected="false">전체</button>
  </div>
  <div class="chips" id="unitFilter" style="margin-bottom:12px"></div>
  <div id="list"></div>
  <button class="more hidden" id="btnMore">더 보기</button>
</div>

<button class="fab" id="btnAdd">＋ 문제 찍어 올리기</button>
<input type="file" id="filePick" accept="image/*" multiple class="hidden">
<input type="file" id="seedPick" accept="image/*" class="hidden">
<input type="file" id="jsonPick" accept="application/json,.json" class="hidden">
<div class="toast" id="toast"></div>

<div class="screen hidden" id="scAdd">
  <div class="bar"><button id="addCancel">닫기</button><span class="t">문제 추가</span><span style="width:40px"></span></div>
  <div class="thumbs" id="addThumbs"></div>
  <button class="big ghost" id="addMore" style="margin-top:10px">사진 더 고르기 <span class="cnt">여러 장 한 번에</span></button>
  <label class="f2">단원</label>
  <div class="chips" id="addUnits"></div>
  <label class="f2">메모 <span style="opacity:.7">(교재·쪽수·문제 번호)</span></label>
  <input type="text" id="addNote" placeholder="예: 응용력 p.57 6번" enterkeyhint="done">
  <button class="primary" id="addSave">저장</button>
  <p class="note">사진 한 장이 문제 하나로 저장됩니다.</p>
</div>

<div class="screen hidden" id="scReview">
  <div class="bar"><button id="revQuit">그만하기</button><span class="t" id="revPos"></span><span style="width:56px"></span></div>
  <div class="progress"><i id="revBar"></i></div>
  <div id="revBody"></div>
</div>

<div class="screen hidden" id="scDetail">
  <div class="bar"><button id="detClose">닫기</button><span class="t" id="detTitle">문제</span><span style="width:40px"></span></div>
  <div id="detBody" class="full"></div>
</div>

<div class="screen hidden" id="scSet">
  <div class="bar"><button id="setClose">닫기</button><span class="t">백업과 설정</span><span style="width:40px"></span></div>
  <label class="f2">다시 풀기 순서</label>
  <div class="chips" id="orderPick"></div>
  <label class="f2">저장 공간</label>
  <div class="meter"><i id="meterBar"></i></div>
  <div class="note" id="meterTxt"></div>
  <label class="f2">백업</label>
  <button class="big ghost" id="doExport">파일로 내보내기 <span class="cnt">.json</span></button>
  <button class="big ghost" id="doImport">파일에서 불러오기 <span class="cnt">합치기</span></button>
  <label class="f2">사진 품질</label>
  <select id="quality">
    <option value="900">보통 — 가로 900px</option>
    <option value="1200">선명 — 가로 1200px</option>
    <option value="1600">아주 선명 — 가로 1600px</option>
  </select>
  <p class="note">기본 133문제는 이 파일 안에 들어 있고, 푼 기록과 찍어 올린 사진은 이 폰 안에만 저장됩니다. 파일을 새로 올려도 기록은 그대로 남습니다.</p>
  <button class="danger" id="wipe">기록 전체 지우기</button>
</div>

<script>
(function(){
"use strict";
function fr(a,b){return '<span class="f"><i>'+a+'</i><i>'+b+'</i></span>'}
function mx(w,a,b){return w+fr(a,b)}

var SEED=[
{n:1,u:'곱셈',t:'0의 개수와 곱의 관계',s:'5번 (1)',q:`□ 안에 알맞은 수를 써넣으세요.<br>5 × □ = 350<br>5 × □ = 3500<br>50 × □ = 3500`},
{n:2,u:'곱셈',t:'곱하는 수를 쪼개어 계산하기',s:'10번',q:`□ 안에 알맞은 수를 써넣으세요.<br>16 × 15 = 16 × □ × 3<br>= □ × 3<br>= □`},
{n:3,u:'곱셈',t:'(두 자리 수) × (두 자리 수)',s:'(2)번',q:`□ 안에 알맞은 수를 써넣으세요.<br>54 × 38 = 54 × 30 + 54 × □<br>= □ + □<br>= □`},
{n:4,u:'곱셈',t:'세로셈 빈칸 채우기',s:'5번',q:`□ 안에 알맞은 수를 써넣으세요.<pre class="v">   2 □ 6
×      3
─────────
   7 3 8</pre>`},
{n:5,u:'곱셈',t:'자릿값으로 나타낸 수의 곱',s:'23번',q:`다음이 나타내는 수와 39의 곱을 구하세요.<div class="bx">10이 6개, 1이 2개인 수</div>`},
{n:6,u:'곱셈',t:'부등식에 들어갈 수의 개수',s:'2번 (서술형)',q:`1부터 9까지의 수 중에서 □ 안에 들어갈 수 있는 수는 모두 몇 개인지 풀이 과정을 쓰고 답을 구해 보세요.<div class="bx">146 × □ &lt; 600</div>`},
{n:7,u:'곱셈',t:'□ 안에 들어갈 수 구하기',s:'15번',q:`1부터 9까지의 수 중에서 □ 안에 들어갈 수 있는 가장 작은 수를 구해 보세요.<div class="bx">78 × □0 &gt; 5000</div>`},
{n:8,u:'곱셈',t:'가장 큰 수와 가장 작은 수의 곱',s:'22번',q:`가장 큰 수와 가장 작은 수의 곱을 구하세요.<div class="bx">81　　27　　42</div>`},
{n:9,u:'곱셈',t:'곱이 가장 큰 곱셈식 만들기',s:'17번',q:`수 카드 3장을 □ 안에 한 번씩만 써넣어 곱이 가장 큰 곱셈식을 만들고, 계산해 보세요.<div class="bx">5　2　7</div><pre class="v">     □
×  □ □</pre>`},
{n:10,u:'곱셈',t:'곱이 가장 큰 곱셈식 만들기',s:'9번',q:`4장의 수 카드를 한 번씩만 사용하여 계산 결과가 가장 큰 곱셈식을 만들고 곱을 구해 보세요.<div class="bx">8　4　6　3</div>□□ × □□ = □`},
{n:11,u:'곱셈',t:'자리가 정해진 곱셈식에서 곱이 가장 클 때',s:'진도책 7번',q:`3장의 수 카드 3, 5, 7을 한 번씩만 사용하여 아래와 같은 곱셈식을 만들려고 합니다. 계산 결과가 가장 클 때의 곱을 구하세요.<div class="bx">□□ × 4□</div>`},
{n:12,u:'곱셈',t:'곱이 가장 작은 곱셈식 만들기',s:'18번',q:`수 카드 3장을 □ 안에 한 번씩만 써넣어 곱이 가장 <b>작은</b> 곱셈식을 만들고, 계산해 보세요.<div class="bx">9　3　5</div><pre class="v">     □
×  □ □</pre>`},
{n:13,u:'곱셈',t:'곱이 가장 작은 곱셈식 만들기',s:'4-1 (서술형)',q:`4장의 수 카드를 한 번씩만 사용하여 (몇십몇) × (몇십몇)을 만들려고 합니다. 만들 수 있는 곱셈 중에서 가장 작은 곱은 얼마인지 풀이 과정을 쓰고 답을 구해 보세요.<div class="bx">4　7　5　2</div>`},
{n:14,u:'곱셈',t:'자리가 정해진 곱셈식에서 곱이 가장 작을 때',s:'진도책 8번',q:`3장의 수 카드 2, 6, 9를 한 번씩만 사용하여 아래와 같은 곱셈식을 만들려고 합니다. 계산 결과가 가장 작을 때의 곱을 구하세요.<div class="bx">□□ × 3□</div>`},
{n:15,u:'곱셈',t:'바르게 계산한 값 구하기',s:'20번 (서술형)',q:`어떤 수에 4를 곱해야 하는데 잘못하여 뺐더니 102가 되었습니다. 바르게 계산하면 얼마인지 풀이 과정을 쓰고 답을 구해 보세요.`},
{n:16,u:'곱셈',t:'약속한 기호에 따라 계산하기',s:'14번',q:`기호 ♣를 보기와 같이 약속할 때 23♣72의 값을 구해 보세요.<div class="bx">가 ♣ 나 = 나 × 가</div>`},
{n:17,u:'곱셈',t:'(몇십몇)×(몇십몇) 문장제',s:'11번',q:`준영이는 매일 책을 45분씩 읽습니다. 준영이가 15일 동안 책을 읽은 시간은 모두 몇 분일까요?`},
{n:18,u:'곱셈',t:'단위를 바꾼 뒤 곱하기',s:'17번',q:`수지는 책을 매일 45쪽씩 읽습니다. 수지가 <b>3주</b> 동안 읽는 책은 모두 몇 쪽인가요?`},
{n:19,u:'곱셈',t:'두 곱의 크기 비교',s:'11번',q:`계산 결과가 더 큰 것을 찾아 기호를 쓰세요.<div class="bx">㉠ 5 × 21　　　㉡ 4 × 27</div>`},
{n:20,u:'곱셈',t:'두 곱을 비교하기',s:'1-3 (서술형)',q:`사과는 한 봉지에 6개씩 27봉지 있고, 귤은 한 봉지에 8개씩 22봉지 있습니다. 사과와 귤 중 어느 것이 몇 개 더 많은지 풀이 과정을 쓰고 답을 구해 보세요.`},

/* 통합 목록 */
function items(){
  var out=SEED.map(function(s){
    var id="s"+s.n, p=prog[id]||{};
    return {id:id,kind:"seed",n:s.n,unit:s.u,title:s.t,src:s.s,q:s.q,fig:!!s.g,
      img:p.img||null,status:p.status||"wrong",wrongCount:p.wrongCount||1,last:p.last||0,order:s.n};
  });
  photos.forEach(function(p,i){
    out.push({id:p.id,kind:"photo",n:null,unit:p.unit,title:p.note||"찍어 올린 문제",src:"",q:"",fig:false,
      img:p.img,status:p.status||"wrong",wrongCount:p.wrongCount||1,last:p.last||0,createdAt:p.createdAt,order:10000+i});
  });
  return out;
}
function byId(id){ var a=items(); for(var i=0;i<a.length;i++) if(a[i].id===id) return a[i]; return null }
function setState(it,patch){
  if(it.kind==="seed"){ var p=prog[it.id]||{}; for(var k in patch) p[k]=patch[k]; prog[it.id]=p; saveProg(); }
  else{ for(var j=0;j<photos.length;j++) if(photos[j].id===it.id){ for(var k2 in patch) photos[j][k2]=patch[k2]; } savePhotos(); }
}

/* 이미지 압축 */
function compress(file){
  return new Promise(function(res,rej){
    var fr2=new FileReader();
    fr2.onload=function(){
      var img=new Image();
      img.onload=function(){
        var max=cfg.q||1200,w=img.width,h=img.height;
        if(Math.max(w,h)>max){ var r=max/Math.max(w,h); w=Math.round(w*r); h=Math.round(h*r) }
        var c=document.createElement("canvas"); c.width=w; c.height=h;
        var x=c.getContext("2d"); x.fillStyle="#fff"; x.fillRect(0,0,w,h); x.drawImage(img,0,0,w,h);
        res(c.toDataURL("image/jpeg",0.72));
      };
      img.onerror=rej; img.src=fr2.result;
    };
    fr2.onerror=rej; fr2.readAsDataURL(file);
  });
}

/* 홈 */
function renderHome(){
  var a=items(),w=0,k=0;
  a.forEach(function(it){ it.status==="known"?k++:w++ });
  $("cw").textContent=w; $("ck").textContent=k;
  var q=queue().length;
  $("revCnt").textContent=q?q+"문제":"없음";
  $("btnReview").disabled=!q;

  var used={}; a.forEach(function(it){ used[it.unit]=(used[it.unit]||0)+1 });
  var uf=$("unitFilter"); uf.innerHTML="";
  uf.appendChild(chip("전체 단원","",unitPick===""));
  UNITS.forEach(function(u){ if(used[u]) uf.appendChild(chip(u+" "+used[u],u,unitPick===u)) });
  renderList();
}
function chip(label,val,on){
  var b=document.createElement("button"); b.textContent=label; b.setAttribute("aria-pressed",on?"true":"false");
  b.onclick=function(){ unitPick=val; shown=PAGE; renderHome() }; return b;
}
function visible(){
  return items().filter(function(it){
    if(filter==="wrong"&&it.status==="known") return false;
    if(filter==="known"&&it.status!=="known") return false;
    if(unitPick&&it.unit!==unitPick) return false;
    return true;
  });
}
function renderList(){
  var v=visible(), el=$("list");
  if(!v.length){ el.innerHTML='<div class="empty">여기에 해당하는 문제가 없습니다.</div>'; $("btnMore").classList.add("hidden"); return }
  el.innerHTML=v.slice(0,shown).map(function(it){
    var k=it.status==="known";
    var lead=it.img?'<img src="'+it.img+'" alt="">':'<span class="no">'+(it.n||"＋")+'</span>';
    return '<button class="item" data-id="'+it.id+'">'+lead+
      '<span class="meta"><span class="top"><span class="unit">'+esc(it.unit)+'</span>'+
      '<span class="badge '+(k?"kn":"w")+'">'+(k?"○":"△")+'</span></span>'+
      '<span class="note">'+esc(it.title)+'</span>'+
      '<span class="date">'+(it.src?esc(it.src)+' · ':'')+'틀린 횟수 '+it.wrongCount+'회</span></span></button>';
  }).join("");
  Array.prototype.forEach.call(el.querySelectorAll(".item"),function(b){ b.onclick=function(){ openDetail(b.dataset.id) } });
  var more=$("btnMore");
  if(v.length>shown){ more.classList.remove("hidden"); more.textContent="더 보기 ("+(v.length-shown)+"문제 남음)" }
  else more.classList.add("hidden");
}
$("btnMore").onclick=function(){ shown+=PAGE; renderList() };

  });
  $("addSave").disabled=!draft.imgs.length;
  $("addSave").textContent=draft.imgs.length?draft.imgs.length+"문제 저장":"저장";
}
$("filePick").onchange=function(e){
  var fs=Array.prototype.slice.call(e.target.files||[]); e.target.value="";
  if(!fs.length) return; toast("사진 정리 중…");
  Promise.all(fs.map(compress)).then(function(l){ draft.imgs=draft.imgs.concat(l); renderAdd() })
    .catch(function(){ toast("사진을 읽지 못했습니다.") });
};
$("addMore").onclick=function(){ $("filePick").click() };
$("addCancel").onclick=function(){ hide("scAdd") };
$("addSave").onclick=function(){
  var note=$("addNote").value.trim(), now=Date.now(), c=draft.imgs.length;
  draft.imgs.forEach(function(src,i){
    photos.push({id:uid(),img:src,unit:draft.unit,note:note,status:"wrong",wrongCount:1,createdAt:now+i});
  });
  savePhotos(); hide("scAdd"); shown=PAGE; renderHome(); toast(c+"문제를 담았습니다.");
};

/* 다시 풀기 */
function queue(){
  var q=items().filter(function(it){ return it.status!=="known" && (!unitPick||it.unit===unitPick) });
  if(cfg.order==="shuffle"){ for(var i=q.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=q[i]; q[i]=q[j]; q[j]=t } }
  return q;
}
$("btnReview").onclick=function(){
  var q=queue(); if(!q.length) return toast("다시 풀 문제가 없습니다.");
  rev={queue:q.map(function(i){return i.id}),i:0,got:0,again:0}; show("scReview"); renderRev();
};
$("revQuit").onclick=function(){ hide("scReview"); renderHome() };
function renderRev(){
  var n=rev.queue.length;
  if(rev.i>=n){
    $("revPos").textContent=""; $("revBar").style.width="100%";
    $("revBody").innerHTML='<div class="done"><div class="big-n kn">'+rev.got+'</div><p>문제를 알게 됐습니다.</p>'+
      '<p class="note">또 틀린 문제 '+rev.again+'개는 다음에 다시 나옵니다.</p><button class="primary" id="revEnd">끝내기</button></div>';
    $("revEnd").onclick=function(){ hide("scReview"); renderHome() }; return;
  }
  var it=byId(rev.queue[rev.i]); if(!it){ rev.i++; return renderRev() }
  $("revPos").textContent=(rev.i+1)+" / "+n;
  $("revBar").style.width=(rev.i/n*100)+"%";
  $("revBody").innerHTML='<div class="qwrap"><div class="qmeta"><span>'+(it.n?it.n+'번 · ':'')+esc(it.unit)+'</span><span>틀린 횟수 '+it.wrongCount+'</span></div>'+
    (it.q?'<div class="q">'+it.q+'</div>':'')+
    (it.img?'<img src="'+it.img+'" alt="문제 사진" style="margin-top:10px">':'')+'</div>'+
    '<div class="judge"><button class="again">또 틀렸어 △</button><button class="got">알겠어 ○</button></div>';
  $("revBody").querySelector(".again").onclick=function(){ judge(it,false) };
  $("revBody").querySelector(".got").onclick=function(){ judge(it,true) };
  window.scrollTo(0,0);
}
function judge(it,ok){
  if(ok){ setState(it,{status:"known",last:Date.now()}); rev.got++ }
  else{ setState(it,{status:"wrong",wrongCount:it.wrongCount+1,last:Date.now()}); rev.again++ }
  rev.i++; renderRev();
}

/* 상세 */
function openDetail(id){ detailId=id; renderDetail(); show("scDetail") }
function renderDetail(){
  var it=byId(detailId); if(!it) return hide("scDetail");
  var k=it.status==="known";
  $("detTitle").textContent=it.n?it.n+"번":"찍어 올린 문제";
  $("detBody").innerHTML=
    (it.q?'<div class="qwrap"><div class="q">'+it.q+'</div></div>':'')+
    (it.img?'<img src="'+it.img+'" alt="문제 사진">':'')+
    '<div class="row"><button id="dW" class="'+(k?"":"on-w")+'">△ 다시 풀기</button><button id="dK" class="'+(k?"on-k":"")+'">○ 알게 됨</button></div>'+
    (it.kind==="seed"?'<button class="big ghost" id="dShot" style="margin-top:12px">'+(it.img?"사진 다시 찍기":"교재 사진 붙이기")+' <span class="cnt">'+(it.fig?"그림 문제":"선택")+'</span></button>':'')+
    '<label class="f2">단원</label><div class="chips" id="dUnits"></div>'+
    (it.kind==="photo"?'<label class="f2">메모</label><input type="text" id="dNote" value="'+esc(it.title)+'">':'')+
    '<div class="hist">'+esc(it.unit)+(it.src?' · '+esc(it.src):'')+' · 틀린 횟수 '+it.wrongCount+'회'+(it.last?'<br>마지막으로 푼 날 '+fmt(it.last):'')+'</div>'+
    (it.kind==="photo"?'<button class="danger" id="dDel">이 문제 삭제</button>':(it.img?'<button class="danger" id="dImgDel">붙인 사진 지우기</button>':''));
  var u=$("dUnits");
  UNITS.forEach(function(name){
    var b=document.createElement("button"); b.textContent=name;
    b.setAttribute("aria-pressed",it.unit===name?"true":"false");
    b.onclick=function(){ setState(it,{}); if(it.kind==="photo"){ for(var j=0;j<photos.length;j++) if(photos[j].id===it.id) photos[j].unit=name; savePhotos(); renderDetail() } else toast("기본 문제의 단원은 바꿀 수 없습니다.") };
    u.appendChild(b);
  });
  if($("dNote")) $("dNote").onchange=function(){ for(var j=0;j<photos.length;j++) if(photos[j].id===it.id) photos[j].note=this.value.trim(); savePhotos(); toast("메모를 저장했습니다.") };
  $("dW").onclick=function(){ setState(it,{status:"wrong"}); renderDetail() };
  $("dK").onclick=function(){ setState(it,{status:"known"}); renderDetail() };
  if($("dShot")) $("dShot").onclick=function(){ $("seedPick").click() };
  if($("dImgDel")) $("dImgDel").onclick=function(){ setState(it,{img:null}); renderDetail() };
  if($("dDel")) $("dDel").onclick=function(){
    if(!confirm("이 문제를 삭제할까요?")) return;
    photos=photos.filter(function(x){ return x.id!==it.id }); savePhotos(); hide("scDetail"); renderHome(); toast("삭제했습니다.");
  };
}
$("seedPick").onchange=function(e){
  var f=e.target.files&&e.target.files[0]; e.target.value=""; if(!f) return;
  toast("사진 정리 중…");
  compress(f).then(function(src){ var it=byId(detailId); setState(it,{img:src}); renderDetail() })
    .catch(function(){ toast("사진을 읽지 못했습니다.") });
};
$("detClose").onclick=function(){ hide("scDetail"); renderHome() };

/* 설정 */
$("btnSettings").onclick=function(){
  var bytes=((localStorage.getItem(KEY)||"").length+(localStorage.getItem(PROG)||"").length)*2;
  $("meterBar").style.width=Math.min(100,bytes/5242880*100).toFixed(1)+"%";
  $("meterTxt").textContent="찍어 올린 문제 "+photos.length+"개 · 약 "+(bytes/1048576).toFixed(1)+"MB 사용 (한도 약 5MB)";
  $("quality").value=String(cfg.q||1200);
  var o=$("orderPick"); o.innerHTML="";
  [["seq","번호 순서대로"],["shuffle","섞어서"]].forEach(function(p){
    var b=document.createElement("button"); b.textContent=p[1];
    b.setAttribute("aria-pressed",(cfg.order||"seq")===p[0]?"true":"false");
    b.onclick=function(){ cfg.order=p[0]; saveCfg(); $("btnSettings").click() }; o.appendChild(b);
  });
  show("scSet");
};
$("setClose").onclick=function(){ hide("scSet"); renderHome() };
$("quality").onchange=function(){ cfg.q=+this.value; saveCfg(); toast("다음 사진부터 적용됩니다.") };
$("doExport").onclick=function(){
  var blob=new Blob([JSON.stringify({v:2,photos:photos,prog:prog})],{type:"application/json"});
  var a=document.createElement("a"); a.href=URL.createObjectURL(blob);
  a.download="수아오답노트_"+new Date().toISOString().slice(0,10)+".json"; a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href) },2000);
};
$("doImport").onclick=function(){ $("jsonPick").click() };
$("jsonPick").onchange=function(e){
  var f=e.target.files[0]; e.target.value=""; if(!f) return;
  var fr3=new FileReader();
  fr3.onload=function(){
    try{
      var d=JSON.parse(fr3.result), add=0, have={};
      photos.forEach(function(i){ have[i.id]=1 });
      (d.photos||d.items||[]).forEach(function(i){ if(i&&i.id&&!have[i.id]){ photos.push(i); add++ } });
      if(d.prog) for(var k in d.prog) prog[k]=d.prog[k];
      savePhotos(); saveProg(); renderHome(); toast("불러왔습니다. 사진 "+add+"개 추가");
    }catch(err){ toast("파일을 읽지 못했습니다.") }
  };
  fr3.readAsText(f);
};
$("wipe").onclick=function(){
  if(!confirm("푼 기록과 찍어 올린 사진을 모두 지웁니다. 되돌릴 수 없습니다.")) return;
  photos=[]; prog={}; savePhotos(); saveProg(); hide("scSet"); renderHome(); toast("모두 지웠습니다.");
};

Array.prototype.forEach.call(document.querySelectorAll('[role="tab"]'),function(b){
  b.onclick=function(){
    document.querySelectorAll('[role="tab"]').forEach(function(x){ x.setAttribute("aria-selected","false") });
    b.setAttribute("aria-selected","true"); filter=b.dataset.f; shown=PAGE; renderList();
  };
});

renderHome();
})();
</script>
</body>
</html>

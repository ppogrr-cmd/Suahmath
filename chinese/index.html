<style>
:root{--subj:#e03131;--subj-d:#6b1414;--subj-l:#ff6b6b;--subj-s:#b02525;
  --ink:#1f2a4d;--soft:#7a8099;--rule:#e9e3e3;--mark:#ffe49c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{min-height:100dvh;background:linear-gradient(180deg,#fff0ee 0%,#fff5f0 55%,#fffaf6 100%);color:var(--ink);
  font-family:"Pretendard Variable",Pretendard,-apple-system,system-ui,sans-serif}
button{font-family:inherit;cursor:pointer}
.wrap{max-width:560px;margin:0 auto;padding:0 16px calc(40px + env(safe-area-inset-bottom))}
.subjbar{max-width:560px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;gap:8px}
.pill{white-space:nowrap;flex:none;background:#fff;border-radius:99px;padding:8px 13px;font-weight:800;font-size:15px;color:#e8590c;box-shadow:0 2px 10px rgba(31,42,77,.12)}
.hero{border-radius:26px;padding:20px 20px 18px;color:#fff;background:linear-gradient(135deg,var(--subj-l),var(--subj) 60%,var(--subj-d));
  box-shadow:0 8px 22px rgba(176,37,37,.25);margin-top:4px}
.hero h1{font-family:"Jua";font-weight:400;font-size:24px;margin:0}
.hero p{margin:4px 0 0;opacity:.85;font-size:14px}
.card{background:#fff;border-radius:24px;padding:18px;margin-top:14px;box-shadow:0 6px 18px rgba(31,42,77,.08)}
.card h3{font-family:"Jua";font-weight:400;font-size:21px;margin:0 0 10px}
.cells{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:8px 0 4px}
.cells i{height:16px;border-radius:8px;background:#f1e8e8;display:block}
.cells i.on{background:var(--subj)}
.cells i.now{box-shadow:0 0 0 2px #fff,0 0 0 4px var(--subj)}
.lb{display:flex;justify-content:space-between;font-size:14px;color:var(--soft)}
.lb b{color:var(--ink)}
.go{width:100%;border:0;border-radius:18px;padding:15px;margin-top:14px;color:#fff;font-family:"Jua";font-size:21px;
  background:linear-gradient(180deg,var(--subj-l),var(--subj));box-shadow:0 5px 0 var(--subj-s)}
.go:active{transform:translateY(3px);box-shadow:0 2px 0 var(--subj-s)}
.go.done{background:linear-gradient(180deg,#ffd43b,#f59f00);box-shadow:0 5px 0 #d9480f}
.streak{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:14px;color:var(--soft)}
.streak b{color:var(--ink);font-size:16px}
.week{margin-left:auto;display:flex;gap:5px}.week i{width:11px;height:11px;border-radius:50%;background:#f1e8e8}.week i.on{background:var(--subj)}
.bar{height:10px;border-radius:6px;background:#f1e8e8;overflow:hidden;margin:10px 0 4px}.bar i{display:block;height:100%;background:var(--subj);border-radius:6px}
.big{font-size:14px;color:var(--soft)}.big b{font-size:26px;color:var(--ink)}
.books{display:flex;gap:6px;overflow-x:auto;margin:12px -4px 10px;padding:0 4px 4px;scrollbar-width:none}
.books::-webkit-scrollbar{display:none}
.books button{flex:none;border:1px solid #f0dada;background:#fff;border-radius:99px;padding:7px 12px;font-size:13px;font-weight:700;color:#4a5170}
.books button.on{background:var(--subj);border-color:var(--subj);color:#fff}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.les{border:0;border-radius:16px;padding:12px;text-align:left;color:#fff;background:linear-gradient(135deg,var(--subj-l),var(--subj))}
.les.full{background:linear-gradient(135deg,#ffd43b,#f59f00)}
.les b{font-family:"Jua";font-weight:400;font-size:18px;display:block;line-height:1.2}
.les span{font-size:12px;opacity:.95}
.les .lbar{height:6px;border-radius:3px;background:rgba(255,255,255,.35);margin-top:6px;overflow:hidden}
.les .lbar i{display:block;height:100%;background:#fff}
.empty{text-align:center;padding:30px 10px;color:var(--soft);line-height:1.6}
.empty .e{font-size:48px}
.sync{text-align:center;font-size:12px;color:var(--soft);margin-top:18px}

/* ===== 읽기 화면 ===== */
#rd{position:fixed;inset:0;z-index:50;overflow:auto;background:linear-gradient(180deg,#fff0ee,#fffaf6);
  padding:calc(12px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom))}
#rd[hidden]{display:none}
.in{max-width:560px;margin:0 auto}
.top{display:flex;align-items:center;gap:10px}
.x{width:40px;height:40px;border-radius:50%;border:0;background:#fff;font-size:18px;box-shadow:0 2px 8px #0001;flex:none}
.pbar{flex:1;display:grid;gap:4px}.pbar i{height:12px;border-radius:6px;background:#f1e8e8;display:block}
.pbar i.on{background:var(--subj)}.pbar i.now{box-shadow:0 0 0 2px #fff,0 0 0 4px var(--subj)}
.chip{display:inline-block;margin:18px 0 6px;padding:6px 14px;border-radius:99px;font-weight:800;font-size:14px;color:#fff;background:var(--subj)}
.do{font-family:"Jua";font-size:23px;margin:4px 0 14px;line-height:1.35;min-height:31px}
.sc{background:#fff;border-radius:26px;padding:26px 18px 22px;box-shadow:0 8px 24px rgba(31,42,77,.08);text-align:center;position:relative}
.zh{font-family:"Noto Sans SC","PingFang SC","Heiti SC",sans-serif;font-weight:500;font-size:34px;line-height:2.1;color:#c6ccd9;word-break:break-all}
.zh ruby{ruby-position:over}
.zh rt{font-family:"Pretendard Variable",Pretendard,sans-serif;font-size:14px;font-weight:600;color:#c6ccd9;letter-spacing:0}
.zh .c{transition:color .12s}
.zh .c.on, .zh .c.on rt{color:var(--ink)}
.zh .c.now, .zh .c.now rt{color:var(--subj)}
.zh.nopy rt{display:none}
.ko{margin-top:12px;font-size:18px;color:#4a5170}
.ko.hide{filter:blur(6px);cursor:pointer}
.cue{margin-top:16px;height:54px}
.cue .t{font-family:"Jua";font-size:24px;color:#e8590c;opacity:0;transition:opacity .25s}
.cue .tb{height:8px;border-radius:4px;background:#ffe8cc;margin:8px auto 0;width:70%;overflow:hidden;opacity:0;transition:opacity .25s}
.cue .tb i{display:block;height:100%;width:0;background:#ff922b;border-radius:4px}
.cue.show .t,.cue.show .tb{opacity:1}
.cue.show .t{animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.08)}}
.tools{display:flex;gap:8px;justify-content:center;margin-top:14px;flex-wrap:wrap}
.tools button{border:0;border-radius:99px;padding:9px 14px;font-size:14px;font-weight:800;background:#fff0f0;color:var(--subj)}
.tools button.off{background:#f1f3f5;color:#868e96}
.btns{display:flex;gap:10px;margin-top:18px}
.btns button{flex:1;border:0;border-radius:18px;padding:17px 10px;font-family:"Jua";font-size:20px}
.btns .main{color:#fff;background:linear-gradient(180deg,var(--subj-l),var(--subj));box-shadow:0 5px 0 var(--subj-s)}
.btns .sub{background:#fff;color:#4a5170;box-shadow:0 3px 0 #e9dede}
.btns.lock button{opacity:.35;filter:grayscale(.6);pointer-events:none}
.chip.mom{background:#fff;color:var(--subj);margin-left:6px;box-shadow:0 0 0 1.5px var(--subj) inset}
.rec{margin-top:16px;min-height:96px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.mic{width:76px;height:76px;border-radius:50%;border:0;font-size:34px;background:linear-gradient(180deg,#ff8787,#e03131);color:#fff;box-shadow:0 5px 0 #b02525}
.mic.on{font-size:26px;animation:pulse 1s ease-in-out infinite;background:linear-gradient(180deg,#ff6b6b,#c92a2a)}
.rl{margin-top:8px;font-size:15px;color:#4a5170;font-weight:700}.rl b{color:var(--subj)}
.cmp{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.cmp button{border:0;border-radius:99px;padding:11px 16px;font-size:15px;font-weight:800;background:#fff0f0;color:var(--subj)}
.cmp button.re{background:#f1f3f5;color:#495057}
.parent{display:block;width:100%;margin-top:14px;border:0;border-radius:18px;padding:14px;background:#fff;color:#4a5170;font-size:15px;font-weight:700;box-shadow:0 3px 10px rgba(31,42,77,.06)}
#pa{position:fixed;inset:0;z-index:60;overflow:auto;background:#fffaf6;padding:calc(12px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom))}
#pa[hidden]{display:none}
.ptabs{flex:1;display:flex;gap:6px;background:#fff;border-radius:99px;padding:4px;box-shadow:0 2px 8px #0001}
.ptabs button{flex:1;border:0;border-radius:99px;padding:9px;font-weight:800;font-size:14px;background:none;color:#7a8099}
.ptabs button.on{background:var(--subj);color:#fff}
.pnote{margin:14px 2px 10px;font-size:14px;color:#4a5170;line-height:1.5}
.prow{display:flex;align-items:center;gap:8px;background:#fff;border-radius:16px;padding:10px 12px;margin-bottom:8px;box-shadow:0 2px 8px rgba(31,42,77,.05)}
.prow.has{box-shadow:0 0 0 2px #ffc9c9 inset}
.pz{flex:1;font-family:"Noto Sans SC","PingFang SC",sans-serif;font-size:19px;line-height:1.3}
.pz small{display:block;font-family:"Pretendard Variable",Pretendard,sans-serif;font-size:12px;color:#868e96}
.pb{display:flex;align-items:center;gap:6px;flex:none}
.pb button{width:42px;height:42px;border-radius:50%;border:0;background:#fff0f0;color:var(--subj);font-size:17px}
.pb button.prec.on{background:#e03131;color:#fff;animation:pulse 1s ease-in-out infinite}
.pb button.warn{width:auto;border-radius:99px;padding:0 12px;background:#e03131;color:#fff;font-size:13px;font-weight:800}
.pst{font-size:13px;color:#868e96}.pst.ok{color:#2f9e44;font-weight:800;font-size:16px}
.pday{display:block;width:100%;text-align:left;border:0;border-radius:14px;padding:12px 14px;margin:6px 0;background:#fff;font-weight:800;font-size:15px;color:var(--ink)}
.pday.on{background:var(--subj);color:#fff}
.toast{position:fixed;left:50%;bottom:40px;transform:translateX(-50%);background:#1f2a4d;color:#fff;padding:12px 18px;border-radius:14px;z-index:99;font-size:14px;max-width:90%}
.fin{text-align:center;padding-top:40px}
.fin .big2{font-size:70px}.fin h2{font-family:"Jua";font-weight:400;font-size:30px;margin:10px 0}
</style>

 {"id": "qs1-044", "b": "轻松学中文", "l": "1b", "zh": "田力喜欢吃苹果。", "py": "tián lì xǐ huan chī píng guǒ", "ko": "톈리는 사과 먹는 걸 좋아해."},
 {"id": "qs1-045", "b": "轻松学中文", "l": "1b", "zh": "红色的苹果，黄色的香蕉。", "py": "hóng sè de píng guǒ huáng sè de xiāng jiāo", "ko": "빨간 사과, 노란 바나나."},
 {"id": "qs1-046", "b": "轻松学中文", "l": "1b", "zh": "绿色的葡萄，蓝色的鱼。", "py": "lǜ sè de pú tao lán sè de yú", "ko": "초록 포도, 파란 물고기."},
 {"id": "qs1-047", "b": "轻松学中文", "l": "1b", "zh": "我叫糖糖，我爱吃草莓。", "py": "wǒ jiào táng tang wǒ ài chī cǎo méi", "ko": "내 이름은 탕탕이고, 딸기를 잘 먹어."},
 {"id": "c301-001", "b": "301구", "l": "上", "zh": "你好！", "py": "nǐ hǎo", "ko": "안녕하세요!"},
 {"id": "c301-002", "b": "301구", "l": "上", "zh": "你好吗？", "py": "nǐ hǎo ma", "ko": "어떻게 지내세요?"},
 {"id": "c301-004", "b": "301구", "l": "上", "zh": "我也很好。", "py": "wǒ yě hěn hǎo", "ko": "저도 잘 지내요."},
 {"id": "c301-005", "b": "301구", "l": "上", "zh": "你早！", "py": "nǐ zǎo", "ko": "안녕하세요! (아침 인사)"},
 {"id": "c301-006", "b": "301구", "l": "上", "zh": "你身体好吗？", "py": "nǐ shēn tǐ hǎo ma", "ko": "건강은 어떠세요?"},
 {"id": "c301-007", "b": "301구", "l": "上", "zh": "谢谢！", "py": "xiè xie", "ko": "감사합니다."},
 {"id": "c301-008", "b": "301구", "l": "上", "zh": "再见！", "py": "zài jiàn", "ko": "안녕히 계세요(가세요)."},
 {"id": "c301-009", "b": "301구", "l": "上", "zh": "你工作忙吗？", "py": "nǐ gōng zuò máng ma", "ko": "일이 바쁘세요?"},
 {"id": "c301-010", "b": "301구", "l": "上", "zh": "很忙。你呢？", "py": "hěn máng nǐ ne", "ko": "매우 바빠요. 당신은요?"},
 {"id": "c301-011", "b": "301구", "l": "上", "zh": "我不太忙。", "py": "wǒ bú tài máng", "ko": "저는 그다지 바쁘지 않아요."},
 {"id": "c301-012", "b": "301구", "l": "上", "zh": "你爸爸、妈妈身体好吗？", "py": "nǐ bà ba mā ma shēn tǐ hǎo ma", "ko": "아빠, 엄마는 건강하세요?"},
 {"id": "c301-014", "b": "301구", "l": "上", "zh": "认识你，很高兴。", "py": "rèn shi nǐ hěn gāo xìng", "ko": "만나서 반가워요."},
 {"id": "c301-015", "b": "301구", "l": "上", "zh": "您贵姓？", "py": "nín guì xìng", "ko": "성이 어떻게 되세요?"},
 {"id": "c301-017", "b": "301구", "l": "上", "zh": "他姓什么？", "py": "tā xìng shén me", "ko": "그는 성이 뭐예요?"},
 {"id": "c301-018", "b": "301구", "l": "上", "zh": "她不是老师，她是学生。", "py": "tā bú shì lǎo shī tā shì xué sheng", "ko": "그녀는 선생님이 아니에요. 학생이에요."},
 {"id": "c301-019", "b": "301구", "l": "上", "zh": "他是谁？", "py": "tā shì shuí", "ko": "그는 누구예요?"},
 {"id": "c301-020", "b": "301구", "l": "上", "zh": "我介绍一下儿。", "py": "wǒ jiè shào yí xià r", "ko": "제가 소개할게요."},
 {"id": "c301-021", "b": "301구", "l": "上", "zh": "你去哪儿？", "py": "nǐ qù nǎ r", "ko": "어디 가요?"},
 {"id": "c301-022", "b": "301구", "l": "上", "zh": "张老师在家吗？", "py": "zhāng lǎo shī zài jiā ma", "ko": "장 선생님은 집에 계세요?"},
 {"id": "c301-023", "b": "301구", "l": "上", "zh": "我是张老师的学生。", "py": "wǒ shì zhāng lǎo shī de xué sheng", "ko": "저는 장 선생님의 학생이에요."},
 {"id": "c301-024", "b": "301구", "l": "上", "zh": "请进！", "py": "qǐng jìn", "ko": "들어오세요."},
 {"id": "c301-025", "b": "301구", "l": "上", "zh": "今天几号？", "py": "jīn tiān jǐ hào", "ko": "오늘이 며칠이에요?"},
 {"id": "c301-026", "b": "301구", "l": "上", "zh": "今天十月三十一号。", "py": "jīn tiān shí yuè sān shí yī hào", "ko": "오늘은 10월 31일이에요."},
 {"id": "c301-027", "b": "301구", "l": "上", "zh": "今天不是星期四，昨天星期四。", "py": "jīn tiān bú shì xīng qī sì zuó tiān xīng qī sì", "ko": "오늘은 목요일이 아니에요. 어제가 목요일이에요."},
 {"id": "c301-028", "b": "301구", "l": "上", "zh": "晚上你做什么？", "py": "wǎn shang nǐ zuò shén me", "ko": "저녁에 뭐 해요?"},
 {"id": "c301-029", "b": "301구", "l": "上", "zh": "你的生日是几月几号？", "py": "nǐ de shēng rì shì jǐ yuè jǐ hào", "ko": "생일이 몇 월 며칠이에요?"},
 {"id": "c301-030", "b": "301구", "l": "上", "zh": "我们上午去他家，好吗？", "py": "wǒ men shàng wǔ qù tā jiā hǎo ma", "ko": "우리 오전에 그의 집에 갈까요?"},
 {"id": "c301-031", "b": "301구", "l": "上", "zh": "你家有几口人？", "py": "nǐ jiā yǒu jǐ kǒu rén", "ko": "가족이 몇 명이에요?"},
 {"id": "c301-032", "b": "301구", "l": "上", "zh": "你爸爸做什么工作？", "py": "nǐ bà ba zuò shén me gōng zuò", "ko": "아빠는 무슨 일을 하세요?"},
 {"id": "c301-033", "b": "301구", "l": "上", "zh": "他在大学工作。", "py": "tā zài dà xué gōng zuò", "ko": "그는 대학교에서 일해요."},
 {"id": "c301-034", "b": "301구", "l": "上", "zh": "我家有爸爸、妈妈和一个弟弟。", "py": "wǒ jiā yǒu bà ba mā ma hé yí ge dì di", "ko": "우리 집에는 아빠, 엄마, 남동생 한 명이 있어요."},
 {"id": "c301-035", "b": "301구", "l": "上", "zh": "哥哥结婚了。", "py": "gē ge jié hūn le", "ko": "형(오빠)은 결혼했어요."},
 {"id": "c301-036", "b": "301구", "l": "上", "zh": "他们没有孩子。", "py": "tā men méi yǒu hái zi", "ko": "그들은 아이가 없어요."},
 {"id": "c301-037", "b": "301구", "l": "上", "zh": "现在几点？", "py": "xiàn zài jǐ diǎn", "ko": "지금 몇 시예요?"},
 {"id": "c301-038", "b": "301구", "l": "上", "zh": "现在七点二十五分。", "py": "xiàn zài qī diǎn èr shí wǔ fēn", "ko": "지금은 7시 25분이에요."},
 {"id": "c301-039", "b": "301구", "l": "上", "zh": "你几点上课？", "py": "nǐ jǐ diǎn shàng kè", "ko": "수업은 몇 시에 시작해요?"},
 {"id": "c301-040", "b": "301구", "l": "上", "zh": "差一刻八点去。", "py": "chà yí kè bā diǎn qù", "ko": "7시 45분에 가요."},
 {"id": "c301-041", "b": "301구", "l": "上", "zh": "我去吃饭。", "py": "wǒ qù chī fàn", "ko": "나는 밥 먹으러 가요."},
 {"id": "c301-042", "b": "301구", "l": "上", "zh": "我们什么时候去？", "py": "wǒ men shén me shí hou qù", "ko": "우리 언제 가요?"},
 {"id": "c301-043", "b": "301구", "l": "上", "zh": "太早了。", "py": "tài zǎo le", "ko": "너무 일러요."},
 {"id": "c301-044", "b": "301구", "l": "上", "zh": "我也六点半起床。", "py": "wǒ yě liù diǎn bàn qǐ chuáng", "ko": "나도 6시 반에 일어나요."},
 {"id": "c301-045", "b": "301구", "l": "上", "zh": "你住在哪儿？", "py": "nǐ zhù zài nǎ r", "ko": "어디에 살아요?"},
 {"id": "c301-046", "b": "301구", "l": "上", "zh": "住在留学生宿舍。", "py": "zhù zài liú xué shēng sù shè", "ko": "유학생 기숙사에 살아요."},
 {"id": "c301-047", "b": "301구", "l": "上", "zh": "多少号房间？", "py": "duō shao hào fáng jiān", "ko": "몇 호실이에요?"},
 {"id": "c301-048", "b": "301구", "l": "上", "zh": "你家在哪儿？", "py": "nǐ jiā zài nǎ r", "ko": "집이 어디예요?"},
 {"id": "c301-049", "b": "301구", "l": "上", "zh": "欢迎你去玩儿。", "py": "huān yíng nǐ qù wán r", "ko": "우리 집에 놀러 오세요."},
 {"id": "c301-050", "b": "301구", "l": "上", "zh": "她常去。", "py": "tā cháng qù", "ko": "그녀는 거기에 자주 가요."},
 {"id": "c301-051", "b": "301구", "l": "上", "zh": "我们一起去吧。", "py": "wǒ men yì qǐ qù ba", "ko": "우리 같이 가요."},
 {"id": "c301-052", "b": "301구", "l": "上", "zh": "那太好了。", "py": "nà tài hǎo le", "ko": "그럼 정말 좋아요!"},
 {"id": "c301-053", "b": "301구", "l": "上", "zh": "八楼在九楼旁边。", "py": "bā lóu zài jiǔ lóu páng biān", "ko": "8동은 9동 옆에 있어요."},
 {"id": "c301-054", "b": "301구", "l": "上", "zh": "去八楼怎么走？", "py": "qù bā lóu zěn me zǒu", "ko": "8동에 어떻게 가요?"},
 {"id": "c301-055", "b": "301구", "l": "上", "zh": "那个楼就是八楼。", "py": "nà ge lóu jiù shì bā lóu", "ko": "저 건물이 바로 8동이에요."},
 {"id": "c301-056", "b": "301구", "l": "上", "zh": "请问，邮局在哪儿？", "py": "qǐng wèn yóu jú zài nǎ r", "ko": "실례지만, 우체국이 어디에 있어요?"},
 {"id": "c301-057", "b": "301구", "l": "上", "zh": "往前走，就是邮局。", "py": "wǎng qián zǒu jiù shì yóu jú", "ko": "앞으로 가면 바로 우체국이에요."},
 {"id": "c301-058", "b": "301구", "l": "上", "zh": "邮局离这儿远不远？", "py": "yóu jú lí zhè r yuǎn bu yuǎn", "ko": "우체국은 여기서 멀어요?"},
 {"id": "c301-059", "b": "301구", "l": "上", "zh": "百货大楼在什么地方？", "py": "bǎi huò dà lóu zài shén me dì fang", "ko": "백화점은 어디에 있어요?"},
 {"id": "c301-060", "b": "301구", "l": "上", "zh": "在哪儿坐汽车？", "py": "zài nǎ r zuò qì chē", "ko": "어디에서 버스를 타요?"},
 {"id": "c301-061", "b": "301구", "l": "上", "zh": "您要什么？", "py": "nín yào shén me", "ko": "뭐가 필요하세요?"},
 {"id": "c301-062", "b": "301구", "l": "上", "zh": "苹果多少钱一斤？", "py": "píng guǒ duō shao qián yì jīn", "ko": "사과 한 근에 얼마예요?"},
 {"id": "c301-063", "b": "301구", "l": "上", "zh": "两块五一斤。", "py": "liǎng kuài wǔ yì jīn", "ko": "한 근에 2.5위안이에요."},
 {"id": "c301-064", "b": "301구", "l": "上", "zh": "您要多少？", "py": "nín yào duō shao", "ko": "얼마나 드릴까요?"},
 {"id": "c301-065", "b": "301구", "l": "上", "zh": "您还要别的吗？", "py": "nín hái yào bié de ma", "ko": "또 필요한 거 있으세요?"},
 {"id": "c301-066", "b": "301구", "l": "上", "zh": "我要买橘子。", "py": "wǒ yào mǎi jú zi", "ko": "저는 귤을 사려고 해요."},
 {"id": "c301-067", "b": "301구", "l": "上", "zh": "橘子太贵了。", "py": "jú zi tài guì le", "ko": "귤이 너무 비싸요."},
 {"id": "c301-068", "b": "301구", "l": "上", "zh": "您尝尝。", "py": "nín cháng chang", "ko": "한번 드셔 보세요."},
 {"id": "c301-069", "b": "301구", "l": "上", "zh": "天冷了。", "py": "tiān lěng le", "ko": "날씨가 추워졌어요."},
 {"id": "c301-070", "b": "301구", "l": "上", "zh": "我想买件毛衣。", "py": "wǒ xiǎng mǎi jiàn máo yī", "ko": "스웨터 한 벌 사고 싶어요."},
 {"id": "c301-071", "b": "301구", "l": "上", "zh": "星期天去，怎么样？", "py": "xīng qī tiān qù zěn me yàng", "ko": "일요일에 가는 거 어때요?"},
 {"id": "c301-072", "b": "301구", "l": "上", "zh": "星期天人太多。", "py": "xīng qī tiān rén tài duō", "ko": "일요일엔 사람이 너무 많아요."},
 {"id": "c301-073", "b": "301구", "l": "上", "zh": "我看看那件毛衣。", "py": "wǒ kàn kan nà jiàn máo yī", "ko": "저 스웨터 좀 볼게요."},
 {"id": "c301-074", "b": "301구", "l": "上", "zh": "这件毛衣我可以试试吗？", "py": "zhè jiàn máo yī wǒ kě yǐ shì shi ma", "ko": "이 스웨터 입어 봐도 돼요?"},
 {"id": "c301-075", "b": "301구", "l": "上", "zh": "这件毛衣不大也不小。", "py": "zhè jiàn máo yī bú dà yě bù xiǎo", "ko": "이 스웨터는 딱 맞아요."},
 {"id": "c301-076", "b": "301구", "l": "上", "zh": "好极了。", "py": "hǎo jí le", "ko": "정말 좋아요!"},
 {"id": "c301-077", "b": "301구", "l": "上", "zh": "这路车到天安门吗？", "py": "zhè lù chē dào tiān ān mén ma", "ko": "이 버스 톈안먼에 가요?"},
 {"id": "c301-078", "b": "301구", "l": "上", "zh": "我买两张票。", "py": "wǒ mǎi liǎng zhāng piào", "ko": "표 두 장 살게요."},
 {"id": "c301-079", "b": "301구", "l": "上", "zh": "到天安门还有几站？", "py": "dào tiān ān mén hái yǒu jǐ zhàn", "ko": "톈안먼까지 몇 정거장 남았어요?"},
 {"id": "c301-080", "b": "301구", "l": "上", "zh": "天安门到了。", "py": "tiān ān mén dào le", "ko": "톈안먼에 도착했어요."},
 {"id": "c301-081", "b": "301구", "l": "上", "zh": "哪儿上的？", "py": "nǎ r shàng de", "ko": "어디에서 탔어요?"},
 {"id": "c301-082", "b": "301구", "l": "上", "zh": "去语言文化大学要换车吗？", "py": "qù yǔ yán wén huà dà xué yào huàn chē ma", "ko": "어언문화대학에 가려면 갈아타야 해요?"},
 {"id": "c301-083", "b": "301구", "l": "上", "zh": "我会说一点儿汉语。", "py": "wǒ huì shuō yì diǎn r hàn yǔ", "ko": "중국어를 조금 할 줄 알아요."},
 {"id": "c301-084", "b": "301구", "l": "上", "zh": "换几路车？", "py": "huàn jǐ lù chē", "ko": "몇 번 버스로 갈아타요?"},
 {"id": "c301-085", "b": "301구", "l": "上", "zh": "我没钱了。", "py": "wǒ méi qián le", "ko": "돈이 떨어졌어요."},
 {"id": "c301-086", "b": "301구", "l": "上", "zh": "听说，饭店里可以换钱。", "py": "tīng shuō fàn diàn li kě yǐ huàn qián", "ko": "호텔에서 환전할 수 있대요."},
 {"id": "c301-087", "b": "301구", "l": "上", "zh": "这儿能不能换钱？", "py": "zhè r néng bu néng huàn qián", "ko": "여기서 환전할 수 있어요?"},
 {"id": "c301-088", "b": "301구", "l": "上", "zh": "您带的什么钱？", "py": "nín dài de shén me qián", "ko": "어떤 돈을 가지고 있어요?"},
 {"id": "c301-089", "b": "301구", "l": "上", "zh": "请您写一下儿钱数。", "py": "qǐng nín xiě yí xià r qián shù", "ko": "금액을 써 주세요."},
 {"id": "c301-090", "b": "301구", "l": "上", "zh": "请数一数。", "py": "qǐng shǔ yi shǔ", "ko": "한번 세어 보세요."},
 {"id": "c301-091", "b": "301구", "l": "上", "zh": "时间不早了。", "py": "shí jiān bù zǎo le", "ko": "시간이 늦었어요."},
 {"id": "c301-092", "b": "301구", "l": "上", "zh": "我们快走吧！", "py": "wǒ men kuài zǒu ba", "ko": "우리 빨리 가요!"},
 {"id": "c301-093", "b": "301구", "l": "上", "zh": "这是新出的纪念邮票。", "py": "zhè shì xīn chū de jì niàn yóu piào", "ko": "이건 새로 나온 기념우표예요."},
 {"id": "c301-094", "b": "301구", "l": "上", "zh": "还有好看的吗？", "py": "hái yǒu hǎo kàn de ma", "ko": "예쁜 거 더 있어요?"},

function ymd(d=new Date()){ const z=n=>String(n).padStart(2,"0"); return d.getFullYear()+"-"+z(d.getMonth()+1)+"-"+z(d.getDate()); }
function dayAdd(n){ const d=new Date(); d.setDate(d.getDate()+n); return ymd(d); }
let rd = store.get("rd") || {};                       // 문장별 읽은 횟수

let showKo = store.get("ko"); if(showKo===null) showKo=true;

const byId=id=>SENT.find(s=>s.id===id);

/* 오늘 읽을 5문장: 아직 안 읽은 문장을 책 순서대로, 다 읽었으면 적게 읽은 문장부터 */
function rollDay(){
  /* 같은 날이라도 문장이 비어 있으면(교재를 넣기 전에 열었던 날) 다시 고른다 */
  const ok = daily.d===ymd() && daily.ids.length && daily.ids.every(id=>byId(id));
  if(ok) return;
  if(daily.d===ymd() && daily.stamp) return;
  const fresh=SENT.filter(s=>!rd[s.id]);
  let ids=fresh.slice(0,DAY_N).map(s=>s.id);
  if(ids.length<DAY_N){
    const old=[...SENT].filter(s=>!ids.includes(s.id)).sort((a,b)=>(rd[a.id]||0)-(rd[b.id]||0));
    ids=ids.concat(old.slice(0,DAY_N-ids.length).map(s=>s.id));
  }
  daily={d:ymd(),n:0,ids,stamp:false}; save(); push();
}
function curStreak(){ return (streak.last===ymd()||streak.last===dayAdd(-1)) ? streak.n : 0; }
/* 보상: 오늘 미션을 끝냈으면 코인 받기 (같은 날은 한 번만) */
function zhEarn(){ if(daily.stamp && daily.d===ymd() && window.rewardEarn) rewardEarn("zh", ymd(), (streak.days||[]).filter(x=>x<ymd())); }
function stampDay(){
  if(daily.stamp) return; daily.stamp=true;
  const t=ymd();
  if(streak.last!==t){ streak.n = streak.last===dayAdd(-1) ? streak.n+1 : 1; streak.last=t; }
  streak.best=Math.max(streak.best||0, streak.n);
  streak.days=[...new Set([...(streak.days||[]), t])].sort().slice(-120);
}

/* ===== 동기화 (수학·영어와 같은 방식, 항상 켜짐) ===== */
let syncState="";
function applyRemote(o){
  if(!o) return;
  for(const [k,v] of Object.entries(o.rd||{})) if((rd[k]||0)<v) rd[k]=v;
  const r=o.dy;
  if(r && r.d){
    if(r.d>daily.d) daily=r;
    else if(r.d===daily.d){ if((r.n||0)>daily.n){ daily.n=r.n; daily.ids=r.ids&&r.ids.length?r.ids:daily.ids; } daily.stamp=daily.stamp||!!r.stamp; }
  }
  const s=o.sk||{};
  if((s.last||"")>(streak.last||"")){ streak.n=s.n; streak.last=s.last; }
  streak.best=Math.max(streak.best||0,s.best||0);
  streak.days=[...new Set([...(streak.days||[]),...(s.days||[])])].sort().slice(-120);
  save();
}

/* ===== 소리 ===== */
let _v=null;
function zhVoice(){
  if(_v) return _v;
  const vs=speechSynthesis.getVoices().filter(v=>/^zh[-_](CN|Hans)/i.test(v.lang)||/^cmn/i.test(v.lang));
  const pref=["Tingting","婷婷","Lili","Yu-shu","Google 普通话","Microsoft Xiaoxiao","Microsoft Xiaoyi","Microsoft Huihui"];
  for(const p of pref){ const v=vs.find(v=>v.name.includes(p)); if(v) return _v=v; }
  return _v = vs[0] || speechSynthesis.getVoices().find(v=>/^zh/i.test(v.lang)) || null;
}
if("speechSynthesis" in window) speechSynthesis.addEventListener?.("voiceschanged",()=>{ _v=null; });
const wait=ms=>new Promise(r=>setTimeout(r,ms));
/* 읽어 주고, 끝나면 돌아온다. 끝 신호가 안 와도 예상 시간이 지나면 넘어간다 */
function speakP(text, rate, onb){
  return new Promise(res=>{
    const n=[...text].length, minT=400+n*120/rate;
    if(!("speechSynthesis" in window)){ setTimeout(res,minT); return; }
    const u=new SpeechSynthesisUtterance(text); u.lang="zh-CN";
    const v=zhVoice(); if(v) u.voice=v; u.rate=rate; u.pitch=1.3;   // 조금 높게, 아이 목소리 느낌
    let done=false; const t0=Date.now();
    const fin=()=>{ if(done) return; done=true; setTimeout(res, Math.max(0, minT-(Date.now()-t0))); };
    u.onend=fin; u.onerror=fin; if(onb) u.onboundary=onb;
    speechSynthesis.cancel(); speechSynthesis.speak(u);
    setTimeout(fin, 3000+n*350/rate);
  });
}

function b64ToUrl(a,t){ const bin=atob(a), u=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i); return URL.createObjectURL(new Blob([u],{type:t})); }
async function loadMomIdx(){ try{ const r=await fetch("/api/cvoice?list=mom",{cache:"no-store"}); if(r.ok){ momIdx=await r.json()||{}; store.set("momIdx",momIdx); } }catch(e){} }

function playUrl(url, rate=1){
  return new Promise(res=>{
    let done=false; const fin=()=>{ if(done) return; done=true; AU.onended=AU.onerror=null; res(); };
    AU.onended=fin; AU.onerror=fin; AU.src=url; AU.playbackRate=rate; try{ AU.preservesPitch=true; AU.webkitPreservesPitch=true; }catch(e){}
    AU.onloadedmetadata=()=>{ if(isFinite(AU.duration)) setTimeout(fin, AU.duration*1000/rate+1200); };
    const p=AU.play(); if(p&&p.catch) p.catch(fin);
    setTimeout(fin, 25000);
  });
}

/* 아이패드는 처음 한 번 손으로 눌러야 소리를 낼 수 있어서, 첫 터치 때 빈 소리로 열어 둔다 */

/* 녹음: 아이패드 Safari의 MediaRecorder는 두 번째 녹음부터 빈 파일이 나오는 일이 있어,
   마이크 소리를 Web Audio로 직접 받아 WAV로 만든다. 녹음마다 마이크를 열고 끝나면 닫는다
   (마이크가 켜져 있으면 아이패드 스피커 소리가 작아지기 때문). */
let mic=null, recr=null, recT0=0, actx=null, rsrc=null, rproc=null, rbufs=[], rrate=44100;
const canRec=()=>!!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia && (window.AudioContext||window.webkitAudioContext));
async function recStart(){
  stopSound(); micOff();
  if(!actx) actx=new (window.AudioContext||window.webkitAudioContext)();
  try{ await actx.resume(); }catch(e){}
  mic=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}});
  rrate=actx.sampleRate; rbufs=[];
  rsrc=actx.createMediaStreamSource(mic);
  rproc=actx.createScriptProcessor(4096,1,1);
  rproc.onaudioprocess=e=>{ rbufs.push(new Float32Array(e.inputBuffer.getChannelData(0))); };
  rsrc.connect(rproc); rproc.connect(actx.destination);
  recr={state:"recording"}; recT0=Date.now();
}
function encodeWav(bufs, inRate, outRate=16000){
  let n=0; bufs.forEach(b=>n+=b.length);
  const all=new Float32Array(n); let o=0; bufs.forEach(b=>{ all.set(b,o); o+=b.length; });
  const ratio=inRate/outRate, m=Math.floor(n/ratio), pcm=new Int16Array(m);
  for(let i=0;i<m;i++){ const st=Math.floor(i*ratio), en=Math.min(n,Math.floor((i+1)*ratio)); let sum=0,c=0; for(let j=st;j<en;j++){ sum+=all[j]; c++; }
    const v=Math.max(-1,Math.min(1,c?sum/c:0)); pcm[i]=v<0?v*0x8000:v*0x7fff; }
  const buf=new ArrayBuffer(44+pcm.length*2), dv=new DataView(buf);
  const W=(p,str)=>{ for(let i=0;i<str.length;i++) dv.setUint8(p+i,str.charCodeAt(i)); };
  W(0,"RIFF"); dv.setUint32(4,36+pcm.length*2,true); W(8,"WAVE"); W(12,"fmt "); dv.setUint32(16,16,true); dv.setUint16(20,1,true); dv.setUint16(22,1,true);
  dv.setUint32(24,outRate,true); dv.setUint32(28,outRate*2,true); dv.setUint16(32,2,true); dv.setUint16(34,16,true); W(36,"data"); dv.setUint32(40,pcm.length*2,true);
  new Int16Array(buf,44).set(pcm);
  return {blob:new Blob([buf],{type:"audio/wav"}), sec:m/outRate};
}
function recStop(){
  return new Promise(res=>{
    if(!recr) return res(null);
    setTimeout(()=>{   // 마지막 조각까지 받도록 잠깐 기다린다
      try{ rsrc && rsrc.disconnect(); rproc && rproc.disconnect(); }catch(e){}
      const bufs=rbufs; rbufs=[]; rsrc=rproc=null; recr=null; micOff();
      if(!bufs.length) return res(null);
      const {blob,sec}=encodeWav(bufs, rrate);
      if(sec<0.3) return res(null);
      res({blob, ms:Math.round(sec*1000), t:"audio/wav", url:URL.createObjectURL(blob)});
    },150);
  });
}
function micOff(){ if(mic){ mic.getTracks().forEach(t=>t.stop()); mic=null; } }
function blobB64(blob){ return new Promise(r=>{ const f=new FileReader(); f.onload=()=>r(String(f.result).split(",")[1]); f.readAsDataURL(blob); }); }
async function upload(kind, id, rec){
  try{ const a=await blobB64(rec.blob);
    const r=await fetch("/api/cvoice",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({kind,id,d:ymd(),a,t:rec.t,ms:rec.ms})});
    return r.ok ? await r.json() : null; }catch(e){ return null; }
}

  const upto=i=>cs.forEach((c,j)=>{ c.classList.toggle("on",j<=i); c.classList.toggle("now",j===i); });
  let byEvent=false; const timers=[];
  const mu=cachedMom(s.id), arate=rate/0.75;            // 엄마 녹음은 보통 속도 1, 천천히는 0.73
  const units=cs.reduce((n,c)=>n+(c.tagName==="RUBY"?1:0.5),0);
  const per = mu && momIdx[s.id].ms ? (momIdx[s.id].ms/arate)*0.92/units : 330/rate;
  let t=0; cs.forEach((c,i)=>{ timers.push(setTimeout(()=>{ if(!byEvent && my===tok) upto(i); }, t)); if(c.tagName==="RUBY") t+=per; else t+=per*0.5; });
  if(mu) await playUrl(mu, arate);
  else await Promise.all([wait(t*0.9), speakP(s.zh, rate, e=>{
    if(e.name && e.name!=="word") return; byEvent=true;
    let i=0; cs.forEach((c,j)=>{ if(+c.dataset.a<=e.charIndex) i=j; }); if(my===tok) upto(i);
  })]);
  if(!mu && momIdx[s.id]) momUrl(s.id);                 // 다음엔 엄마 목소리로
  timers.forEach(clearTimeout);
  if(my===tok){ upto(cs.length-1); cs[cs.length-1].classList.remove("now"); }
  return t;
}
/* 따라 읽을 시간: 막대가 차는 동안 */
async function cue(ms, my, label){
  const c=document.getElementById("cue"); if(!c) return;
  c.querySelector(".t").textContent=label;
  const b=c.querySelector(".tb i"); b.style.transition="none"; b.style.width="0";
  c.classList.add("show"); void b.offsetWidth; b.style.transition=`width ${ms}ms linear`; b.style.width="100%";
  await wait(ms); if(my===tok) c.classList.remove("show");
}

/* ===== 읽기 화면 =====
   R = {ids, i, kind:"daily"|"lesson", title} */
let R=null;
function openRead(ids, kind, title){
  if(!ids.length){ rollDay(); ids=daily.ids; if(!ids.length) return; }
  R={ids, i: kind==="daily" ? Math.min(daily.n, ids.length) : 0, kind, title};
  prefetchMom(ids);
  document.getElementById("rd").hidden=false; document.body.style.overflow="hidden"; renderRead();
}
/* 수아 녹음 올리기 — 실패하면 기기에 모아 두고 다음에 열 때 다시 보낸다 */
const kidQ=[];
async function sendKid(id, rec){
  const j=await upload("kid", id, rec);
  if(j && j.ok){ rec.k=j.k; urlCache["k:"+j.k]=rec.url; return true; }
  kidQ.push([id,rec]); alertBox("녹음을 올리지 못했어요. 인터넷이 되면 다시 보낼게요.");
  return false;
}
async function flushKid(){ while(kidQ.length){ const [id,rec]=kidQ[0]; const j=await upload("kid", id, rec); if(!(j&&j.ok)) return; kidQ.shift(); } }
window.addEventListener("online", flushKid);
document.addEventListener("visibilitychange",()=>{ if(!document.hidden) flushKid(); });
function closeRead(){   tok++; stopSound(); clearInterval(recTimer); try{ rsrc && rsrc.disconnect(); rproc && rproc.disconnect(); }catch(e){} recr=null; rbufs=[]; micOff(); document.getElementById("rd").hidden=true; document.body.style.overflow=""; R=null; renderHome(); }
function renderRead(){
  const el=document.getElementById("rdIn"), n=R.ids.length;
  let bar=""; for(let i=0;i<n;i++) bar+=`<i class="${i<R.i?"on":""} ${i===R.i?"now":""}"></i>`;
  const top=`<div class="top"><button class="x" data-a="close" aria-label="닫기">✕</button><div class="pbar" style="grid-template-columns:repeat(${n},1fr)">${bar}</div></div>`;
  if(R.i>=n){
    const daily1=R.kind==="daily";
    el.innerHTML=top+`<div class="fin"><div class="big2">🎉</div><h2>${daily1?"오늘 중국어 끝!":"다 읽었어요!"}</h2>
      <p>${n}문장을 소리 내어 읽었어요.${daily1?`<br>🔥 ${curStreak()}일 연속`:""}</p>
      <div class="btns"><button class="sub" data-a="close">홈으로</button><button class="main" data-a="again">한 번 더 ▶</button></div></div>`;
    return;
  }
  const s=byId(R.ids[R.i]); if(!s){ R.i++; return renderRead(); }
  el.innerHTML=top+`
    <span class="chip">${esc(R.title)} · ${R.i+1} / ${n}</span>${momIdx[s.id]?`<span class="chip mom">👩 엄마 목소리</span>`:""}
    <div class="do" id="do">잘 들어 보세요</div>
    <div class="sc">
      <div class="zh ${showPy?"":"nopy"}" id="zh">${sentHTML(s)}</div>
      <div class="ko ${showKo?"":"hide"}" id="ko">${esc(s.ko||"")}</div>
      <div class="rec" id="recBox"></div>
      <div class="tools">
        <button data-a="replay">🔁 다시 듣기</button><button data-a="slow">🐢 천천히</button>
        <button data-a="py" class="${showPy?"":"off"}">병음 ${showPy?"켬":"끔"}</button>
        <button data-a="ko" class="${showKo?"":"off"}">뜻 ${showKo?"켬":"끔"}</button>
      </div>
    </div>
    <div class="btns lock" id="btns"><button class="main" data-a="next">다 읽었어요 ✓</button></div>`;
  R.rec=null; R.rs="wait"; run(s);
}
/* 녹음 칸 */
function setRec(st){
  if(!R) return; R.rs=st; const el=document.getElementById("recBox"); if(!el) return;
  const who=momIdx[R.ids[R.i]]?"👩 엄마":"🔊 선생님";
  el.innerHTML =
    st==="ready" ? `<button class="mic" data-a="recGo">🎙️</button><div class="rl">눌러서 녹음하고 따라 읽어요</div>` :
    st==="on"    ? `<button class="mic on" data-a="recEnd">■</button><div class="rl">다 읽으면 눌러요 <b id="recSec">0초</b></div>` :
    st==="done"  ? `<div class="cmp"><button data-a="hearModel">▶ ${who}</button><button data-a="hearMine">▶ 내 목소리</button><button data-a="recGo" class="re">🎙️ 다시</button></div>` :
    st==="nomic" ? `<div class="rl">마이크를 쓸 수 없어요. 소리 내어 따라 읽어 보세요.</div>` : "";
}
let recTimer=null;
/* 한 문장: 듣기 → 🎙️ 따라 읽으며 녹음 → 선생님(엄마)과 내 목소리 비교 → 버튼 열림 */
const doTxt=t=>{ const d=document.getElementById("do"); if(d) d.textContent=t; };
async function run(s, rate=0.75){
  const my=++tok, alive=()=>my===tok && R && !document.getElementById("rd").hidden;
  if(R.rs!=="done") doTxt("잘 들어 보세요");
  await karaoke(s, rate, my); if(!alive()) return;
  if(R.rs==="wait"){
    if(canRec()){ setRec("ready"); doTxt("🎙️ 버튼을 누르고 따라 읽어 보세요"); }
    else { setRec("nomic"); doTxt("소리 내어 따라 읽어 보세요"); document.getElementById("btns").classList.remove("lock"); }
  }
}
async function compare(s){
  const my=++tok, alive=()=>my===tok && R;
  doTxt(`${momIdx[s.id]?"엄마":"선생님"} 목소리와 내 목소리를 들어 봐요`);
  await karaoke(s, 0.75, my); if(!alive()) return;
  await wait(300); if(!alive()) return;
  if(R.rec) await playUrl(R.rec.url); if(!alive()) return;
  doTxt("잘 읽었나요?");
  document.getElementById("btns").classList.remove("lock");
}
document.getElementById("rd").addEventListener("click",e=>{
  const b=e.target.closest("[data-a]"); if(!b){ if(e.target.closest("#ko")){ showKo=true; store.set("ko",true); document.getElementById("ko").classList.remove("hide"); } return; }
  const a=b.dataset.a, s=R && byId(R.ids[R.i]);
  if(a==="close") return closeRead();
  if(a==="again"){ const ids=R.kind==="daily" ? R.ids : R.ids; R={...R, i:0, kind: R.kind==="daily"?"more":R.kind}; return renderRead(); }
  if(a==="replay" && s){ return run(s); }
  if(a==="slow" && s){ return run(s, 0.55); }
  if(a==="recGo" && s){
    tok++; stopSound();
    recStart().then(()=>{
      setRec("on"); doTxt("🎙️ 듣고 있어요. 소리 내어 읽어요!");
      clearInterval(recTimer); const t0=Date.now(), max=Math.max(8000,[...s.zh].length*900);
      recTimer=setInterval(()=>{ const el=document.getElementById("recSec"); if(el) el.textContent=Math.floor((Date.now()-t0)/1000)+"초";
        if(Date.now()-t0>max) document.querySelector('[data-a="recEnd"]')?.click(); },250);
    }).catch(()=>{ setRec("nomic"); doTxt("소리 내어 따라 읽어 보세요"); document.getElementById("btns").classList.remove("lock"); });
    return;
  }
  if(a==="recEnd" && s){
    clearInterval(recTimer);
    recStop().then(rec=>{ if(!R) return; if(!rec){ setRec("ready"); alertBox("녹음이 안 됐어요. 한 번 더 눌러 주세요."); return; }
      const old=R.rec; R.rec=rec; setRec("done");
      // 녹음하자마자 올린다 — '다 읽었어요'를 안 눌러도 부모 화면에서 들을 수 있다
      sendKid(s.id, rec).then(ok=>{ if(ok && old && old.k) fetch("/api/cvoice?kind=kid&k="+encodeURIComponent(old.k),{method:"DELETE"}).catch(()=>{}); });
      document.getElementById("btns").classList.remove("lock");   // 녹음했으면 바로 넘어갈 수 있게 (비교 듣기는 계속)
      compare(s); });
    return;
  }
  if(a==="hearModel" && s){ const my=++tok; return karaoke(s,0.75,my); }
  if(a==="hearMine" && R && R.rec){ tok++; stopSound(); return playUrl(R.rec.url); }
  if(a==="py"){ showPy=!showPy; store.set("py",showPy); document.getElementById("zh").classList.toggle("nopy",!showPy); b.classList.toggle("off",!showPy); b.textContent="병음 "+(showPy?"켬":"끔"); return; }
  if(a==="ko"){ showKo=!showKo; store.set("ko",showKo); document.getElementById("ko").classList.toggle("hide",!showKo); b.classList.toggle("off",!showKo); b.textContent="뜻 "+(showKo?"켬":"끔"); return; }
  if(a==="next" && s){
    if(b.closest(".lock")) return;
    tok++; stopSound(); clearInterval(recTimer);
    R.rec=null;                                      // 녹음은 멈출 때 이미 올렸다
    rd[s.id]=(rd[s.id]||0)+1;
    R.i++;
    if(R.kind==="daily"){ daily.n=Math.max(daily.n,R.i); if(daily.n>=daily.ids.length){ stampDay(); setTimeout(zhEarn,0); } }
    save(); push(); renderRead();
  }
});

/* ===== 홈 ===== */
function renderHome(){
  rollDay(); zhEarn();
  const el=document.getElementById("home");
  document.getElementById("pStreak").textContent="🔥 "+curStreak()+"일";
  const d0=new Date(), wd=["일","월","화","수","목","금","토"];
  const hero=`<div class="hero"><h1>${daily.stamp?"糖糖，很好！👏":"糖糖，今天也读一读吧！"}</h1><p>${d0.getMonth()+1}월 ${d0.getDate()}일 ${wd[d0.getDay()]}요일</p></div>`;
  if(!SENT.length){
    el.innerHTML=hero+`<div class="card"><div class="empty"><div class="e">📷</div>아직 교재 문장이 없어요.<br>교재 사진을 받으면 여기에 문장이 채워져요.</div></div>`;
    return;
  }
  const n=daily.ids.length, done=Math.min(daily.n,n);
  let cells=""; for(let i=0;i<n;i++) cells+=`<i class="${i<done?"on":""} ${i===done&&!daily.stamp?"now":""}"></i>`;
  let wk=""; for(let i=-6;i<=0;i++) wk+=`<i class="${(streak.days||[]).includes(dayAdd(i))?"on":""}"></i>`;
  const label = daily.stamp ? "한 번 더 읽기" : done ? `이어서 읽기 ▶ (${done}/${n})` : "시작하기 ▶";
  const readN=SENT.filter(s=>rd[s.id]).length, pc=Math.round(readN/SENT.length*100);
  // 교재 → 과
  const books=[...new Set(SENT.map(s=>s.b||"교재"))];
  if(!books.includes(book)) book=books[0];
  const les=new Map(); SENT.filter(s=>(s.b||"교재")===book).forEach(s=>{ const o=les.get(s.l)||{n:0,r:0,ids:[]}; o.n++; if(rd[s.id]) o.r++; o.ids.push(s.id); les.set(s.l,o); });
  const tiles=[...les].map(([l,o])=>{ const p=Math.round(o.r/o.n*100);
    return `<button class="les ${p===100?"full":""}" data-les="${esc(l)}"><b>${esc(l)}</b><span>읽음 ${o.r} / ${o.n}</span><div class="lbar"><i style="width:${Math.max(p,3)}%"></i></div></button>`; }).join("");
  el.innerHTML=hero+`
    <div class="card">
      <h3>오늘의 미션</h3>
      <div class="lb"><span>문장 읽기</span><span><b>${done}</b> / ${n}</span></div>
      <div class="cells" style="grid-template-columns:repeat(${n},1fr)">${cells}</div>
      <div class="streak"><b>${curStreak()}일 연속</b> 최고 ${streak.best||0}일<div class="week">${wk}</div></div>
      <button class="go ${daily.stamp?"done":""}" data-go="daily">${label}</button>
    </div>
    <div class="card">
      <h3>진도</h3>
      <div class="big"><b>${readN}</b> / ${SENT.length} 문장 읽음</div>
      <div class="bar"><i style="width:${pc}%"></i></div>
      <div class="books">${books.map(b=>`<button class="${b===book?"on":""}" data-book="${esc(b)}">${esc(b)}</button>`).join("")}</div>
      <div class="grid">${tiles}</div>
      <div class="big" style="margin-top:10px;font-size:13px">과를 누르면 그 과의 문장을 처음부터 읽어요</div>
    </div>
    <button class="parent" data-pa="open">👪 부모 · 엄마 녹음 / 수아 녹음 듣기</button>
    <div class="sync">${syncState?"동기화: "+syncState:""}</div>`;
}
document.getElementById("home").addEventListener("click",e=>{
  const g=e.target.closest("[data-go]");
  if(g){
    if(daily.stamp) return openRead(daily.ids,"more","한 번 더");
    return openRead(daily.ids,"daily","오늘의 문장");
  }
  if(e.target.closest("[data-pa]")) return openPa();
  const bk=e.target.closest("[data-book]"); if(bk){ book=bk.dataset.book; store.set("book",book); return renderHome(); }
  const l=e.target.closest("[data-les]");
  if(l){ const ids=SENT.filter(s=>(s.b||"교재")===book && s.l===l.dataset.les).map(s=>s.id); return openRead(ids,"lesson",l.dataset.les); }
});

/* ===== 부모 화면 ===== */
let PA={tab:"mom", rec:null, recId:null, kid:null, day:null, del:null, busy:{}};
function openPa(){ PA.kid=null; document.getElementById("pa").hidden=false; document.body.style.overflow="hidden"; renderPa(); loadMomIdx().then(()=>{ renderPa(); prefetchMom(SENT.map(x=>x.id)); }); }
function closePa(){ stopSound(); try{ rsrc && rsrc.disconnect(); rproc && rproc.disconnect(); }catch(e){} recr=null; rbufs=[]; micOff(); PA.recId=null; document.getElementById("pa").hidden=true; document.body.style.overflow=""; renderHome(); }
function fmtT(at){ const d=new Date(at); return d.getHours()+":"+String(d.getMinutes()).padStart(2,"0"); }
function renderPa(){
  const el=document.getElementById("paIn");
  const tabs=`<div class="top"><button class="x" data-p="close" aria-label="닫기">✕</button>
    <div class="ptabs"><button class="${PA.tab==="mom"?"on":""}" data-p="tab" data-t="mom">👩 엄마 녹음</button><button class="${PA.tab==="kid"?"on":""}" data-p="tab" data-t="kid">🎙️ 수아 녹음</button></div></div>`;
  if(PA.tab==="mom"){
    const n=SENT.filter(x=>momIdx[x.id]).length;
    el.innerHTML=tabs+`<div class="pnote">문장마다 🎙️을 눌러 읽고, ■로 멈추면 저장돼요. 녹음한 문장은 미션에서 엄마 목소리로 나와요. <b>${n} / ${SENT.length}</b></div>`+
      SENT.map(x=>{ const has=!!momIdx[x.id], on=PA.recId===x.id, busy=PA.busy[x.id];
        return `<div class="prow ${has?"has":""}"><div class="pz">${esc(x.zh)}<small>${esc(x.py)}</small></div>
          <div class="pb">${busy?`<span class="pst">저장 중…</span>`:has?`<span class="pst ok">✓</span>`:""}
            <button data-p="play" data-id="${x.id}">▶</button>
            <button class="${on?"prec on":"prec"}" data-p="${on?"stop":"rec"}" data-id="${x.id}">${on?"■":"🎙️"}</button>
            ${has?`<button data-p="del" data-id="${x.id}" class="${PA.del===x.id?"warn":""}">${PA.del===x.id?"삭제?":"🗑"}</button>`:""}</div></div>`; }).join("");
    return;
  }
  // 수아 녹음
  if(!PA.kid){ el.innerHTML=tabs+`<div class="pnote">불러오는 중…</div>`;
    fetch("/api/cvoice?list=kid",{cache:"no-store"}).then(r=>r.ok?r.json():[]).catch(()=>[]).then(j=>{ PA.kid=Array.isArray(j)?j:[]; renderPa(); }); return; }
  const days=[...new Set(PA.kid.map(x=>x.d))];
  el.innerHTML=tabs+(days.length?`<div class="pnote">날짜를 누르면 그날 수아가 따라 읽은 녹음을 들을 수 있어요. (60일 보관)</div>`:`<div class="pnote">아직 수아 녹음이 없어요.</div>`)+
    days.map(d=>{ const list=PA.kid.filter(x=>x.d===d), open=PA.day===d;
      return `<button class="pday ${open?"on":""}" data-p="day" data-d="${d}">${d} · ${list.length}개 ${open?"▲":"▼"}</button>`+
        (open?list.map(x=>{ const s=byId(x.id), ready=!!urlCache["k:"+x.k];
          return `<div class="prow"><div class="pz">${esc(s?s.zh:x.id)}<small>${fmtT(x.at)} · ${Math.round((x.ms||0)/1000)}초</small></div>
            <div class="pb"><button data-p="kplay" data-k="${x.k}">${ready?"▶":PA.busy["k"+x.k]?"…":"▶"}</button></div></div>`; }).join(""):""); }).join("");
}
document.getElementById("pa").addEventListener("click",e=>{
  const b=e.target.closest("[data-p]"); if(!b) return;
  const p=b.dataset.p, id=b.dataset.id, x=id&&byId(id);
  if(p==="close") return closePa();
  if(p==="tab"){ PA.tab=b.dataset.t; PA.del=null; if(PA.tab==="kid") PA.kid=null; return renderPa(); }
  if(p==="play" && x){ stopSound(); const u=cachedMom(id); if(u) playUrl(u); else speakP(x.zh,0.75); return; }
  if(p==="rec" && x){
    if(PA.recId) return;
    recStart().then(()=>{ PA.recId=id; renderPa(); }).catch(()=>{ alertBox("마이크를 쓸 수 없어요. 설정에서 마이크를 허용해 주세요."); });
    return;
  }
  if(p==="stop"){
    recStop().then(async rec=>{ const rid=PA.recId; PA.recId=null; if(!rec){ renderPa(); alertBox("녹음이 안 됐어요. 다시 눌러 주세요."); return; }
      PA.busy[rid]=true; renderPa(); playUrl(rec.url);
      const j=await upload("mom", rid, rec); delete PA.busy[rid];
      if(j && j.idx){ momIdx=j.idx; store.set("momIdx",momIdx); urlCache[momKey(rid)]=rec.url; } else alertBox("저장하지 못했어요. 인터넷을 확인하고 다시 녹음해 주세요.");
      renderPa(); });
    return;
  }
  if(p==="del" && x){
    if(PA.del!==id){ PA.del=id; return renderPa(); }
    PA.del=null; fetch("/api/cvoice?kind=mom&id="+encodeURIComponent(id),{method:"DELETE"}).then(r=>r.ok?r.json():null).then(j=>{ if(j&&j.idx){ momIdx=j.idx; store.set("momIdx",momIdx); } renderPa(); });
    return;
  }
  if(p==="day"){ const d=b.dataset.d; PA.day = PA.day===d ? null : d; renderPa();
    if(PA.day){ (async()=>{ for(const x of PA.kid.filter(y=>y.d===d)){ await kidUrl(x.k); if(PA.day===d) renderPa(); } })(); } return; }
  if(p==="kplay"){ stopSound(); const k=b.dataset.k, u=urlCache["k:"+k];
    if(u){ playUrl(u); return; }
    PA.busy["k"+k]=true; renderPa();
    kidUrl(k).then(u2=>{ delete PA.busy["k"+k]; renderPa(); if(u2) playUrl(u2); else alertBox("녹음을 불러오지 못했어요. 잠시 뒤에 다시 눌러 주세요."); });
    return; }
});
function alertBox(t){ const n=document.createElement("div"); n.className="toast"; n.textContent=t; document.body.appendChild(n); setTimeout(()=>n.remove(),3000); }

renderHome(); pull(); loadMomIdx().then(()=>prefetchMom(daily.ids));
document.addEventListener("visibilitychange",()=>{ if(!document.hidden && document.getElementById("rd").hidden){ pull(); renderHome(); } });
</script>
